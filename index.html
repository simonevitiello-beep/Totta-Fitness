<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0806">
<title>Totta Fitness</title>
<meta name="apple-mobile-web-app-title" content="Totta">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  /* Font salvati dentro l'app: funzionano anche senza rete, in palestra. */
  @font-face{font-family:'Oswald';src:url(fonts/oswald-latin-500-normal.woff2) format('woff2');font-weight:500;font-display:swap;}
  @font-face{font-family:'Oswald';src:url(fonts/oswald-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap;}
  @font-face{font-family:'Playfair Display';src:url(fonts/playfair-display-latin-700-italic.woff2) format('woff2');font-weight:700;font-style:italic;font-display:swap;}
  /* Palette presa dalla foto di riferimento: nero del manto, caramello e sabbia del pelo. */
  :root{
    --bg:#0A0806; --card:#14100B; --card2:#1C160F; --border:#33271B;
    --text:#F0E4CF; --muted:#A39077;
    --gold:#9A6A35; --gold-light:#D4A260; --gold-dim:#4A3420;
    --sand:#DCC39A;
    --red:#A32D2D; --red-light:#E24B4A; --red-dim:#4A1B0C;
    --green:#3B6D11; --green-light:#639922;
    --amber:#BA7517; --amber-light:#EF9F27;
    --blue:#185FA5;
    --font-display:'Oswald', 'Arial Narrow', sans-serif;
    --font-title:'Playfair Display', Georgia, serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior-y:none;}
  body{padding-bottom:74px; min-height:100vh;}
  header.top{position:sticky;top:0;z-index:10;padding:calc(14px + env(safe-area-inset-top)) 16px 13px;
    background:linear-gradient(180deg, rgba(10,8,6,.18) 0%, rgba(10,8,6,.38) 55%, rgba(10,8,6,.78) 100%),
      url(leopard.jpg) center 40%/cover, #0A0806;
    border-bottom:1px solid var(--gold-dim);
    box-shadow:0 1px 0 rgba(212,162,96,.18), 0 8px 20px rgba(0,0,0,.45);}
  header.top h1{font-family:var(--font-title);font-style:italic;font-size:27px;margin:0 0 2px;font-weight:700;
    letter-spacing:0.2px;color:var(--sand);text-shadow:0 2px 10px rgba(0,0,0,.75);line-height:1.15;}
  header.top h1 .acc{color:var(--gold-light);}
  header.top .sub{font-family:var(--font-display);font-size:12px;color:var(--sand);letter-spacing:.9px;
    text-transform:uppercase;font-weight:500;text-shadow:0 1px 6px rgba(0,0,0,.9);opacity:.92;}
  header.top .sub .dot{color:var(--gold-light);margin:0 6px;}
  main{padding:14px 14px 24px;max-width:560px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:14px;margin-bottom:12px;}
  .card h2{font-family:var(--font-display);font-size:15px;margin:0 0 10px;color:var(--muted);
    text-transform:uppercase;letter-spacing:0.6px;font-weight:500;}
  .row{display:flex;gap:8px;align-items:center;}
  .row.between{justify-content:space-between;}
  .row.wrap{flex-wrap:wrap;}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;}
  .pill.ok{background:rgba(22,163,74,.18);color:#4ADE80;}
  .pill.warn{background:rgba(217,119,6,.18);color:#FBBF24;}
  .pill.bad{background:rgba(220,38,38,.18);color:#F87171;}
  .pill.muted{background:rgba(139,147,167,.15);color:var(--muted);}
  .bar-bg{background:var(--card2);border-radius:8px;height:10px;overflow:hidden;flex:1;}
  .bar-fill{height:100%;border-radius:8px;transition:width .3s;}
  .macro-line{margin-bottom:9px;}
  .macro-line .lbl{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;}
  .macro-line .lbl b{color:var(--text);font-weight:700;}
  .macro-line .lbl span{color:var(--muted);}
  .banner{border-radius:12px;padding:11px 12px;margin-bottom:12px;font-size:13px;line-height:1.4;
    border:1px solid;}
  .banner.bad{background:rgba(220,38,38,.1);border-color:rgba(220,38,38,.35);color:#FCA5A5;}
  .banner.warn{background:rgba(217,119,6,.1);border-color:rgba(217,119,6,.35);color:#FCD34D;}
  .banner.ok{background:rgba(22,163,74,.1);border-color:rgba(22,163,74,.35);color:#86EFAC;}
  h3.section{font-family:var(--font-display);font-size:14px;color:var(--sand);text-transform:uppercase;
    letter-spacing:.8px;margin:18px 2px 10px;font-weight:500;display:flex;align-items:center;gap:10px;}
  h3.section::after{content:"";flex:1;height:6px;border-radius:3px;
    background:url(leopard.jpg) center/220px auto;opacity:.75;}
  .exercise{border-left:3px solid var(--gold-dim);}
  details.info{margin-bottom:12px;}
  details.info summary{list-style:none;cursor:pointer;font-family:var(--font-display);font-size:13px;letter-spacing:.6px;
    text-transform:uppercase;color:var(--gold-light);padding:10px 12px;border:1px solid var(--gold-dim);border-radius:12px;
    background:var(--card);}
  details.info summary::-webkit-details-marker{display:none;}
  details.info summary::after{content:" \25BE";}
  details.info[open] summary{border-bottom-left-radius:0;border-bottom-right-radius:0;}
  details.info[open] summary::after{content:" \25B4";}
  details.info .body{border:1px solid var(--gold-dim);border-top:none;border-radius:0 0 12px 12px;padding:11px 12px;
    font-size:13px;line-height:1.55;color:var(--muted);background:var(--card);}
  details.info .body b{color:var(--text);}
  .soon{text-align:center;padding:34px 18px;}
  .soon .leo{width:84px;height:84px;border-radius:50%;margin:0 auto 14px;background:url(leopard.jpg) center/cover;
    border:2px solid var(--gold-dim);box-shadow:0 0 0 4px rgba(212,162,96,.08);}
  .soon h2{font-family:var(--font-title) !important;font-style:italic;text-transform:none !important;font-size:22px !important;
    color:var(--sand) !important;letter-spacing:0 !important;font-weight:700 !important;margin-bottom:8px !important;}
  .soon p{color:var(--muted);font-size:13.5px;line-height:1.55;margin:0;}
  .btn{appearance:none;border:none;border-radius:10px;padding:11px 14px;font-size:14.5px;
    font-weight:700;cursor:pointer;background:var(--card2);color:var(--text);
    border:1px solid var(--border);}
  .btn:active{transform:scale(.97);}
  .btn.primary,.btn.small{font-family:var(--font-display);letter-spacing:0.4px;}
  .btn.primary{text-transform:uppercase;}
  .btn.primary{background:var(--gold-light);border-color:var(--gold-light);color:#0A0A0A;}
  .btn.ghost{background:transparent;}
  .btn.small{padding:7px 10px;font-size:12.5px;}
  .btn.block{width:100%;}
  input,select,textarea{background:var(--card2);border:1px solid var(--border);color:var(--text);
    border-radius:9px;padding:9px 10px;font-size:14.5px;width:100%;font-family:inherit;}
  label.f{display:block;font-size:11.5px;color:var(--muted);margin:0 0 4px;font-weight:600;}
  .field{margin-bottom:10px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;}
  nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);
    border-top:1px solid var(--border);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    z-index:20;}
  nav.tabs button{flex:1;background:none;border:none;color:var(--muted);font-size:10.5px;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-weight:600;}
  nav.tabs button .ic{font-size:19px;}
  nav.tabs button.active{color:var(--sand);}
  nav.tabs button.active .ic{color:var(--gold-light);}
  .fissoitem{display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:9px 0;border-bottom:1px solid var(--border);}
  .fissoitem:last-child{border-bottom:none;}
  .fissoitem-name{font-size:13.5px;font-weight:600;}
  .fissoitem-macro{font-size:11px;color:var(--muted);}
  .fissoitem-controls{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
  .fissoitem-controls input{width:56px;text-align:center;padding:8px 4px;}
  .meal-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;
    border-bottom:1px solid var(--border);}
  .meal-item:last-child{border-bottom:none;}
  .meal-item .nm{font-size:13.5px;font-weight:600;}
  .meal-item .mc{font-size:11.5px;color:var(--muted);}
  .meal-item .del{color:var(--muted);background:none;border:none;font-size:18px;padding:2px 6px;}
  .slot-title{font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 4px;
    text-transform:uppercase;letter-spacing:.4px;}
  .foodlib-item{display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:10px;background:var(--card2);border-radius:10px;margin-bottom:6px;border:1px solid var(--border);}
  .foodlib-item .nm{font-size:13px;font-weight:600;}
  .foodlib-item .mc{font-size:11px;color:var(--muted);}
  .foodlib-item button{background:var(--gold-light);color:#0A0A0A;border:none;border-radius:8px;
    padding:7px 12px;font-size:12px;font-weight:700;}
  .tag{display:inline-block;background:var(--card2);border:1px solid var(--border);
    border-radius:8px;padding:3px 8px;font-size:11px;color:var(--muted);margin-right:5px;}
  .exercise{background:var(--card2);border:1px solid var(--border);border-radius:12px;
    padding:10px;margin-bottom:8px;}
  .exercise .exname{font-size:13.5px;font-weight:700;margin-bottom:2px;}
  .exercise .target{font-size:11.5px;color:var(--amber-light);font-weight:700;margin-bottom:4px;}
  .exercise .prev{font-size:12.5px;margin-bottom:8px;}
  .exercise .prev .prevlabel{color:var(--muted);font-weight:600;}
  .exercise .prev .prevval{color:#fff;font-weight:800;}
  .exercise .inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .setrows{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
  .setrow{display:flex;align-items:center;gap:8px;}
  .resttimer{position:fixed;left:12px;right:12px;bottom:74px;z-index:60;display:none;
    background:#17120C;border:1px solid var(--border);border-radius:14px;padding:10px 12px;
    box-shadow:0 10px 28px rgba(0,0,0,.55);overflow:hidden;}
  .resttimer.show{display:flex;align-items:center;gap:10px;}
  .resttimer .t{font-family:Oswald,system-ui,sans-serif;font-size:26px;font-weight:700;min-width:72px;}
  .resttimer .lbl{font-size:11.5px;color:var(--muted);line-height:1.3;flex:1;}
  .resttimer .bar{position:absolute;left:0;bottom:0;height:3px;background:#D4A437;width:100%;
    transition:width .25s linear;background:var(--gold-light);}
  .resttimer.done{border-color:rgba(22,163,74,.5);}
  .resttimer.done .t{color:#86EFAC;}
  .resttimer.done .bar{background:#22C55E;}
  details.rom{margin:0 0 8px;}
  details.rom summary{list-style:none;cursor:pointer;font-size:11.5px;font-weight:700;
    color:var(--gold-light);padding:5px 9px;border:1px solid var(--gold-dim);
    border-radius:9px;display:inline-block;}
  details.rom summary::-webkit-details-marker{display:none;}
  details.rom summary::after{content:" \25BE";}
  details.rom[open] summary::after{content:" \25B4";}
  details.rom[open] summary{border-bottom-left-radius:0;border-bottom-right-radius:0;}
  .rombody{border:1px solid var(--gold-dim);border-top:none;border-radius:0 9px 9px 9px;
    padding:9px 10px;font-size:11.5px;line-height:1.6;color:var(--muted);}
  .rombody .r{display:flex;gap:8px;margin-bottom:5px;}
  .rombody .r:last-child{margin-bottom:0;}
  .rombody .k{flex:0 0 104px;color:var(--gold-light);font-weight:700;}
  .rombody b{color:var(--text);}
  .rombody .err{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);color:#E0A0A0;}
  .sugg{font-size:12px;font-weight:700;border-radius:9px;padding:6px 9px;margin:2px 0 8px;
    border:1px solid var(--border);line-height:1.35;}
  .sugg.su{background:rgba(22,163,74,.12);border-color:rgba(22,163,74,.4);color:#86EFAC;}
  .sugg.giu{background:rgba(220,38,38,.1);border-color:rgba(220,38,38,.35);color:#FCA5A5;}
  .sugg.forse{background:rgba(217,119,6,.1);border-color:rgba(217,119,6,.35);color:#FCD34D;}
  .sugg.resta,.sugg.info{background:var(--card2);color:var(--muted);font-weight:600;}
  /* v21 - note dell'esercizio (fissa, con video) e della seduta (perche' il carico e' cambiato) */
  details.rom.mynote summary{color:var(--muted);border-color:var(--border);}
  details.rom.mynote.piena summary{color:var(--gold-light);border-color:var(--gold-dim);}
  details.rom.mynote .rombody{border-color:var(--border);}
  details.rom.mynote.piena .rombody{border-color:var(--gold-dim);}
  .mynote textarea,.notaoggi textarea{font-size:13px;line-height:1.45;padding:8px 9px;resize:vertical;min-height:44px;}
  .notelbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:10px 0 5px;}
  .notelbl:first-child{margin-top:0;}
  .vidrow{display:flex;align-items:center;gap:6px;margin-top:6px;}
  .vidrow a.vid{flex:1;min-width:0;display:block;text-decoration:none;font-size:12.5px;font-weight:700;
    color:#0A0A0A;background:var(--gold-light);border-radius:8px;padding:8px 10px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .vidrow .btn{flex:0 0 auto;}
  .vidadd{display:flex;gap:6px;margin-top:6px;}
  .vidadd input{font-size:12.5px;padding:8px;min-width:0;}
  .vidadd input.u{flex:1;}
  .vidadd .btn{flex:0 0 auto;}
  .vidvuoto{font-size:11.5px;color:var(--muted);}
  .facolt{text-transform:none;letter-spacing:0;font-weight:600;opacity:.75;margin-left:4px;}
  .notesep{border-top:1px dashed var(--border);margin:12px 0 2px;}
  .chiptec .box{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;
    border:1.5px solid currentColor;border-radius:4px;margin-right:7px;font-size:11px;vertical-align:-2px;}
  .chiptec{display:flex !important;align-items:center;width:100%;}
  .notaoggi{margin-top:8px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px;}
  .chiptec{display:inline-block;font-size:11.5px;font-weight:700;border-radius:8px;padding:6px 9px;margin-bottom:7px;
    border:1px dashed var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:inherit;}
  .chiptec.on{border-style:solid;border-color:var(--amber);background:rgba(217,119,6,.14);color:var(--amber-light);}
  .prevnota{font-size:11.5px;color:var(--muted);line-height:1.45;margin:-4px 0 8px;padding:6px 9px;
    border-left:2px solid var(--amber);background:rgba(217,119,6,.06);border-radius:0 8px 8px 0;white-space:pre-wrap;}
  .prevnota b,.histnota b{color:var(--amber-light);}
  .histnota{font-size:11px;color:var(--muted);margin-top:3px;white-space:pre-wrap;line-height:1.4;}
  .cardiorow{display:flex;align-items:center;gap:8px;}
  .cardiorow input[type=number]{width:72px;flex:0 0 72px;text-align:center;padding:7px 6px;}
  .exhead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .exmove{display:flex;gap:4px;flex:0 0 auto;}
  .exmove button{padding:2px 8px;font-size:14px;line-height:1.4;min-width:30px;}
  .setrow .setlabel{width:56px;flex:0 0 auto;font-size:12px;color:var(--muted);font-weight:700;}
  .setrow input{flex:1;min-width:0;padding:8px 4px;text-align:center;}
  .setrow .x{color:var(--muted);font-size:12px;flex:0 0 auto;}
  .setrow.warm input{opacity:.62;border-style:dashed;}
  .setrow.warm .setlabel{color:var(--muted);font-weight:600;font-size:11px;opacity:.8;}
  .setrow .warmtag{flex:0 0 66px;max-width:66px;text-align:center;font-size:9.5px;
    letter-spacing:.04em;color:var(--muted);opacity:.7;}
  .setrows .warmsep{font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);margin:8px 0 2px;padding-top:8px;border-top:1px dashed var(--border);}
  .setrow .rirbox{flex:0 0 66px;max-width:66px;font-weight:700;}
  .setrow .rirbox.fuoritarget{box-shadow:0 0 0 1px var(--gold-light) inset;}
  .target .rirtgt{color:var(--gold-light);}
  .setrow .rirbox::placeholder{font-weight:400;font-size:11px;}
  .setrow .rirbox.rir2{border-color:#3d7186;color:#79aec4;}
  .setrow .rirbox.rir1{border-color:#a76a12;color:#dda247;}
  .setrow .rirbox.rir0{border-color:#c23a1d;color:#fff;background:#c23a1d;}
  .exercise .alt{margin-top:8px;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);}
  .exercise .alt{flex-wrap:wrap;}
  .exercise.skipped{opacity:.75;border-style:dashed;}
  .exercise.skipped .exname{text-decoration:line-through;color:var(--muted);}
  .subbadge{display:inline-block;font-size:11px;font-weight:700;border-radius:7px;padding:4px 8px;
    background:var(--gold-dim);color:var(--gold-light);border:1px solid var(--gold);}
  .subbadge.skip{background:var(--red-dim);color:var(--red-light);border-color:var(--red);}
  .sostbox{margin-top:8px;background:var(--card);border:1px solid var(--gold-dim);border-radius:10px;padding:10px;}
  .sosttitle{font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
    color:var(--gold-light);margin:2px 0 8px;}
  .sostnote{font-size:12px;color:var(--muted);line-height:1.45;margin-bottom:8px;}
  .sostbox .btn.block{margin-bottom:6px;text-align:left;display:block;line-height:1.35;}
  .sostmeta{display:block;font-size:10.5px;font-weight:600;color:var(--muted);margin-top:2px;
    letter-spacing:0;text-transform:none;font-family:inherit;}
  .sostbox .btn.consigliato{background:var(--green);border-color:var(--green-light);color:#F2F5EC;}
  .sostbox .btn.consigliato .sostmeta{color:#D6E3C6;}
  .sostbox .btn.warnpick{border-color:var(--amber);}
  .sostbox .btn.warnpick .sostmeta{color:var(--amber-light);}
  .sostbox .mus{font-size:10.5px;font-weight:600;color:var(--gold-light);text-transform:none;letter-spacing:0;}
  .daysel{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px;}
  .daysel button{flex:0 0 auto;background:var(--card2);border:1px solid var(--border);color:var(--muted);
    border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:700;white-space:nowrap;}
  .daysel button.active{background:var(--gold-light);border-color:var(--gold-light);color:#0A0A0A;}
  svg.chart{width:100%;height:auto;display:block;}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:20px 0;}
  .photogrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
  .photogrid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;border:1px solid var(--border);}
  .settingsgroup{margin-bottom:18px;}
  .weekday-map{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px;}
  .weekday-map div{text-align:center;}
  .weekday-map label.f{text-align:center;}
  a.filebtn{display:block;text-align:center;}
  .stat{background:var(--card2);border-radius:10px;padding:10px;text-align:center;border:1px solid var(--border);}
  .stat .n{font-size:20px;font-weight:800;}
  .stat .l{font-size:10.5px;color:var(--muted);margin-top:2px;}
  table.progtable{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px;}
  table.progtable th{text-align:left;color:var(--muted);font-weight:700;padding:6px 4px;
    border-bottom:1px solid var(--border);font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;}
  table.progtable td{padding:6px 4px;border-bottom:1px solid var(--border);}
  table.progtable tr:last-child td{border-bottom:none;}
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#241C13;
    border:1px solid var(--border);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;
    z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;}
  .toast.show{opacity:1;}
  /* v23 - avvisi fissi: spazio esaurito (rosso) e nuova versione (verde) */

let DB = loadDB();
migrateExdbV3();
reconcileExdbRir();

function loadDB(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return defaultDB();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultDB(), parsed);
  }catch(e){ return defaultDB(); }
}
/* v23 - Salvataggio che non fallisce in silenzio.
   localStorage ha un tetto (circa 5 milioni di caratteri su Chrome): superato quello,
   setItem lancia QuotaExceededError e, senza questo blocco, ogni modifica successiva
   sembrava salvata ma spariva alla riapertura. Ora l'errore accende un avviso rosso
   fisso che resta finche' un salvataggio non va a buon fine. */
// "var" e non "let": saveDB() viene chiamata dalle migrazioni all'avvio, prima che
// questa riga sia eseguita. Con "let" sarebbe zona morta temporale e schermata nera.
var STORAGE_KO = false;
function saveDB(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(DB));
    if(STORAGE_KO){ STORAGE_KO = false; mostraAvvisoStorage(false); }
  }catch(e){
    STORAGE_KO = true;
    mostraAvvisoStorage(true);
  }
}
function mostraAvvisoStorage(on){
  const el = document.getElementById("storageAlert");
  if(!el) return;
  el.classList.toggle("show", !!on);
}
// Tiene allineati i piatti "di serie" (stesso nome) alle macro più recenti definite in DEFAULT_FOODLIB,
// così le correzioni fatte una volta (es. valori reali presi dal sito Nutribees) si applicano anche
// a chi ha già l'app installata con dati vecchi salvati. Non tocca alimenti aggiunti/rinominati da te.
// Alcuni piatti li avevo inseriti in libreria con un nome diverso da quello ufficiale
// del sito Nutribees, e i valori erano vecchi. Rinominarli una volta sola basta:
// da li' in poi ci pensa reconcileFoodLibrary ad allineare i macro.
// Lo storico dei pasti non viene toccato: ogni pasto registrato conserva il nome e i
// valori che aveva quel giorno.
// Il vecchio obiettivo di 71 kg nasceva dal BMI e ignorava la massa magra: con 64,6 kg
// di massa magra misurata, 71 kg significherebbe il 9% di grasso. Il primo traguardo
// sensato e' 78 kg (circa 18%). Una volta sola, e solo se il valore e' ancora quello vecchio.
function migraPesoObiettivo(){
  if(DB.targetWeightV2) return;
  if(Number(DB.targetWeight) === 71) DB.targetWeight = 78;
  DB.targetWeightV2 = true;
  saveDB();
}
function rinominaAlimenti(){
  const RINOMINA = {
    "Nutribees Pollo in curcuma con zucchine": "Nutribees Pollo con curcuma e zucchine grigliate"
  };
  if(!Array.isArray(DB.foodLibrary)) return;
  let changed = false;
  Object.keys(RINOMINA).forEach(vecchio=>{
    const nuovo = RINOMINA[vecchio];
    const i = DB.foodLibrary.findIndex(f=>f.name===vecchio);
    if(i < 0) return;
    if(DB.foodLibrary.some(f=>f.name===nuovo)){
      DB.foodLibrary.splice(i,1);      // il nome nuovo c'e' gia': tolgo il doppione
    } else {
      DB.foodLibrary[i].name = nuovo;  // rinomino, i valori li sistema il reconcile
    }
    changed = true;
  });
  if(changed) saveDB();
}
function reconcileFoodLibrary(){
  let changed = false;
  DEFAULT_FOODLIB.forEach(def=>{
    const existing = DB.foodLibrary.find(f=>f.name===def.name);
    if(existing && (existing.kcal!==def.kcal || existing.pro!==def.pro || existing.carb!==def.carb || existing.fat!==def.fat || existing.costo!==def.costo)){
      existing.kcal=def.kcal; existing.pro=def.pro; existing.carb=def.carb; existing.fat=def.fat; existing.costo=def.costo;
      changed = true;
    }
  });
  if(changed) saveDB();
}
// Stesso principio di reconcileFoodLibrary, ma per gli alimenti del piano fisso (stesso id = valori aggiornati).
// Salta gli item marcati "customized" (modificati a mano dall'utente tramite l'editor in-app),
// altrimenti ogni correzione futura da parte mia cancellerebbe le sue personalizzazioni.
function reconcilePianoFisso(){
  let changed = false;
  if(!DB.pianoFisso) return;
  Object.keys(DEFAULT_PIANO_FISSO).forEach(slot=>{
    if(!DB.pianoFisso[slot]) return;
    DEFAULT_PIANO_FISSO[slot].forEach(def=>{
      const existing = DB.pianoFisso[slot].find(it=>it.id===def.id);
      if(existing && !existing.customized && (existing.kcalU!==def.kcalU || existing.proU!==def.proU || existing.carbU!==def.carbU || existing.fatU!==def.fatU)){
        existing.kcalU=def.kcalU; existing.proU=def.proU; existing.carbU=def.carbU; existing.fatU=def.fatU;
        changed = true;
      }
    });
  });
  if(changed) saveDB();
}

/* ============================= HELPERS ============================= */
function todayStr(){ return fmtDate(new Date()); }
function fmtDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function addDays(dateStr, n){
  const d = new Date(dateStr+"T12:00:00");
  d.setDate(d.getDate()+n);
  return fmtDate(d);
}
function niceDate(dateStr){
  const d = new Date(dateStr+"T12:00:00");
  return `${IT_DAYS[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}`;
}
function weekdayOf(dateStr){ return new Date(dateStr+"T12:00:00").getDay(); }
function lunediCorrente(dateStr){
  const wd = weekdayOf(dateStr); // 0=dom..6=sab
  const daysSinceMonday = wd===0 ? 6 : wd-1;
  return addDays(dateStr, -daysSinceMonday);
}
function round1(n){ return Math.round(n*10)/10; }
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove("show"), 2200);
}
function uid(){ return Math.random().toString(36).slice(2,10); }

/* ---- v23: foto in IndexedDB ------------------------------------------------
   Le foto pesano 90-150 mila caratteri l'una e stavano in localStorage insieme
   a tutto il resto: con il tetto di ~5 milioni di caratteri, 3 foto a settimana
   riempivano tutto in 4-5 mesi, e da li' nessun salvataggio andava piu' a buon fine.
   Ora l'immagine sta in IndexedDB (centinaia di MB disponibili) e in DB.fotoLog
   resta solo la scheda {id, date, note, idb:true}. Le foto gia' salvate vengono
   spostate una volta sola all'avvio (migraFotoInIdb). Export e import le portano
   con se' nel campo fotoData. Se IndexedDB non esiste si torna al vecchio modo. */
var FOTO_DB = "tottaFoto", FOTO_STORE = "foto"; // var: vedi nota su STORAGE_KO
function fotoDb(){
  return new Promise((res, rej)=>{
    if(!window.indexedDB) return rej(new Error("IndexedDB non disponibile"));
    const r = indexedDB.open(FOTO_DB, 1);
    r.onupgradeneeded = ()=>{ r.result.createObjectStore(FOTO_STORE); };
    r.onsuccess = ()=>res(r.result);
    r.onerror = ()=>rej(r.error);
  });
}
function fotoTx(mode, fn){
  return fotoDb().then(db=>new Promise((res, rej)=>{
    const tx = db.transaction(FOTO_STORE, mode);
    const out = fn(tx.objectStore(FOTO_STORE));
    tx.oncomplete = ()=>{ db.close(); res(out && out.result !== undefined ? out.result : true); };
    tx.onerror = ()=>{ db.close(); rej(tx.error); };
  }));
}
function fotoPut(id, dataUrl){ return fotoTx("readwrite", st=>st.put(dataUrl, id)); }
function fotoDel(id){ return fotoTx("readwrite", st=>st.delete(id)); }
function fotoClear(){ return fotoTx("readwrite", st=>st.clear()); }
function fotoAll(){
  return fotoDb().then(db=>new Promise((res, rej)=>{
    const out = {};
    const st = db.transaction(FOTO_STORE, "readonly").objectStore(FOTO_STORE);
    const cur = st.openCursor();
    cur.onsuccess = ()=>{ const c = cur.result; if(c){ out[c.key] = c.value; c.continue(); } else { db.close(); res(out); } };
    cur.onerror = ()=>{ db.close(); rej(cur.error); };
  }));
}
async function migraFotoInIdb(){

/* ---- Storico immutabile ------------------------------------------------
   Prima i totali di un giorno passato venivano ricalcolati sui valori ATTUALI
   dell'alimento: modificarlo riscriveva la storia, eliminarlo la faceva sparire.
   Ora ogni registrazione congela i valori del momento (pianoFissoSnap) e gli
   alimenti tolti dal piano finiscono in archivio invece che nel nulla.        */
function resolveFissoItem(dateStr, slot, itemId){
  const bag = DB.pianoFissoSnap && DB.pianoFissoSnap[dateStr] && DB.pianoFissoSnap[dateStr][slot];
  if(bag && bag[itemId]) return bag[itemId];
  const cur = (DB.pianoFisso[slot]||[]).find(it=>it.id===itemId);
  if(cur) return cur;
  const arc = (DB.pianoFissoArchivio||[]).find(it=>it.id===itemId && it.slot===slot);
  if(arc) return arc;
  return null;
}
function snapshotFisso(dateStr, slot, itemId){
  const it = (DB.pianoFisso[slot]||[]).find(x=>x.id===itemId);
  if(!it) return;
  if(!DB.pianoFissoSnap) DB.pianoFissoSnap = {};
  if(!DB.pianoFissoSnap[dateStr]) DB.pianoFissoSnap[dateStr] = {};
  if(!DB.pianoFissoSnap[dateStr][slot]) DB.pianoFissoSnap[dateStr][slot] = {};
  DB.pianoFissoSnap[dateStr][slot][itemId] = {
    id:it.id, l:it.l, unit:it.unit, defaultQty:it.defaultQty,
    kcalU:it.kcalU, proU:it.proU, carbU:it.carbU, fatU:it.fatU, costoU:it.costoU||0
  };
}
// Recupera le righe di log che puntano ad alimenti spariti dal piano: crea una voce
// in archivio, così quei giorni tornano visibili e i valori si possono reinserire.
function migrateFissoOrfani(){
  if(!DB.pianoFissoArchivio) DB.pianoFissoArchivio = [];
  if(!DB.pianoFissoSnap) DB.pianoFissoSnap = {};

  Object.keys(DB.pianoFissoLog||{}).forEach(d=>{
    Object.keys(DB.pianoFissoLog[d]||{}).forEach(slot=>{
      Object.keys(DB.pianoFissoLog[d][slot]||{}).forEach(id=>{
        if(!(Number(DB.pianoFissoLog[d][slot][id])>0)) return;
        if(resolveFissoItem(d, slot, id)) return;
        DB.pianoFissoArchivio.push({
          id, slot, l:"⚠ "+id+" — valori da reinserire", unit:"porzione", defaultQty:1,
          kcalU:0, proU:0, carbU:0, fatU:0, costoU:0, archiviato:true
        });
        changed = true;
      });
    });
  });
  if(changed) saveDB();
}
// Porta i target di RIR anche sugli exdb già salvati in locale, senza toccare
// etichette, serie o ripetizioni che l'utente può aver personalizzato.
// La struttura degli esercizi è cambiata (riassetto del 4 settembre 2026):
// sostituisce una sola volta l'exdb salvato in locale. Lo storico degli
// allenamenti non viene toccato: vive in workoutLog, non qui.
// Versione della scheda prescritta. Va alzata di uno ogni volta che DEFAULT_EXDB cambia
// davvero: e' il segnale che dice all'app installata di sostituire la scheda salvata.
// Il confronto e' "minore di", non "diverso da". Sembra un dettaglio ed e' il punto:
// una versione precedente aveva come default lo stesso numero che la migrazione usa per
// dirsi conclusa, quindi appena l'app si apriva quel numero finiva salvato in memoria e
// da li' in poi la migrazione si saltava da sola, per sempre. Con "minore di" e un default
// a 0 il numero salvato puo' solo far partire la migrazione, mai bloccarla per sbaglio.
/* Revisione del 21 settembre 2026 — taglio a 2.200 kcal.
   Due settimane di dati (9-21/9) hanno mostrato peso fermo a 2.603 kcal/giorno reali:
   il TDEE e' ~2.500, non 2.950, quindi il target di 2.350 dava un deficit di 150 kcal.
   Questa migrazione porta il target a 2.200 e alleggerisce il piano fisso di 288 kcal.
   Lo storico NON si tocca: ogni giorno registrato ha i suoi valori congelati in
   pianoFissoSnap, quindi cambiare il piano oggi non riscrive i totali di ieri. */
function migraPiano2200(){
  // Dichiarata qui dentro, non fuori: la funzione gira all'avvio, prima che una
  // costante di primo livello sia inizializzata (errore gia' fatto con EXDB_VERSION).
  const PIANO_VERSION = 2;
  if(Number(DB.pianoVersion||0) >= PIANO_VERSION) return;

  // Target: si tocca solo se e' ancora quello vecchio, per non sovrascrivere
  // un valore che nel frattempo sia stato cambiato a mano.
  if(DB.targets && Number(DB.targets.kcal) === 2350) DB.targets.kcal = 2200;

  const trova = (slot, id, testo) => {
    const lista = (DB.pianoFisso && DB.pianoFisso[slot]) || [];
    return lista.find(it => it && (it.id === id || (testo && String(it.l||"").toLowerCase().indexOf(testo) >= 0))) || null;
  };

  // Pane di segale: mezza porzione. Si cambia la quantita' standard, non i valori:
  // cosi' l'alimento resta quello e il campo del giorno parte gia' a 0,5.
  const pane = trova("spuntino-pm", "pane-segale", "pane di segale");
  if(pane && Number(pane.defaultQty) === 1) pane.defaultQty = 0.5;

  // Avena serale: da 100 g + 200 ml a 60 g + 120 ml (il 60% dei valori di prima).
  const avena = trova("spuntino-sera", "avena-sera", "avena");
  if(avena && Number(avena.kcalU) > 400){
    avena.l = "Avena overnight (60g + 120ml latte)";
    avena.kcalU = 281;
    avena.proU  = 12.1;
    avena.carbU = 41.3;
    avena.fatU  = 6.1;
    if(avena.costoU) avena.costoU = Math.round(avena.costoU * 60) / 100;
    avena.customized = true;
  }

  DB.pianoVersion = PIANO_VERSION;
  saveDB();
}
function migrateExdbV3(){
  // Dichiarata qui dentro e non fuori: la funzione viene chiamata all'avvio, prima del punto
  // in cui una costante di primo livello sarebbe gia' inizializzata.
  const EXDB_VERSION = 1;
  if(Number(DB.exdbVersion||0) >= EXDB_VERSION) return;
  /* v23 - Migrazione per chiave, non piu' sostituzione in blocco.
     Prima ogni aggiornamento della scheda cancellava tutto cio' che era stato fatto
     dall'editor (esercizi aggiunti, rinominati, serie cambiate) senza dire niente.
     Ora: gli esercizi con la stessa chiave prendono i valori prescritti dal default
     (serie, ripetizioni, RIR, avvicinamenti, recupero, passo, nome); i nuovi vengono
     aggiunti; quelli tolti dal default spariscono, MA gli esercizi creati dall'editor
     (chiave che inizia per "nuovo-esercizio-") restano dove sono, in coda al giorno.
     La scheda precedente viene conservata in DB.exdbPrecedente e si puo' rimettere
     dall'editor in Impostazioni. */
  const vecchia = DB.exdb ? JSON.parse(JSON.stringify(DB.exdb)) : null;
  const nuova = JSON.parse(JSON.stringify(DEFAULT_EXDB));
  if(vecchia){
    Object.keys(nuova).forEach(g=>{
      const vd = vecchia[g];
      if(!vd || !Array.isArray(vd.ex)) return;
      const chiaviNuove = {};
      nuova[g].ex.forEach(e=>{ chiaviNuove[e.k] = true; });
      vd.ex.forEach(e=>{
        if(e && e.k && !chiaviNuove[e.k] && /^nuovo-esercizio-/.test(e.k)) nuova[g].ex.push(JSON.parse(JSON.stringify(e)));
      });
    });
    if(JSON.stringify(vecchia) !== JSON.stringify(DEFAULT_EXDB)) DB.exdbPrecedente = {versione: Number(DB.exdbVersion||0), data: todayStr(), exdb: vecchia};
  }
  DB.exdb = nuova;
  DB.exdbVersion = EXDB_VERSION;
  saveDB();
}

// Riparazione non distruttiva: completa i campi mancanti senza toccare il resto.
// Serve per gli esercizi che aggiungi tu dall'editor, che nascono senza avvicinamenti e
// senza target RIR, e per quando cambi il numero di serie e i target restano spaiati.
// Non sostituisce mai la scheda: le tue modifiche restano dove sono.
function reconcileExdbShape(){
  let changed = false;
  const warmDiDefault = {}, recDiDefault = {}, stepDiDefault = {};
  Object.keys(DEFAULT_EXDB).forEach(g=>{
    (DEFAULT_EXDB[g].ex||[]).forEach(e=>{
      if(e.warm!==undefined) warmDiDefault[e.k] = e.warm;
      if(e.rec) recDiDefault[e.k] = e.rec;
      if(e.step) stepDiDefault[e.k] = e.step;
    });
  });
  Object.keys(DB.exdb||{}).forEach(g=>{
    const day = DB.exdb[g];
    if(!day || !Array.isArray(day.ex)) return;
    day.ex.forEach(e=>{
      const nSets = Math.max(1, Number(e.sets)||1);
      if(e.warm===undefined){
        e.warm = warmDiDefault[e.k]!==undefined ? warmDiDefault[e.k] : 1;
        changed = true;
      }
      if(!e.rec){
        e.rec = recDiDefault[e.k] || (e.warm>=2 ? 180 : 120);
        changed = true;
      }
      if(!e.step){
        e.step = stepDiDefault[e.k] || 2.5;
        changed = true;
      }
      if(!Array.isArray(e.rir)){
        // Nessun target: ne genero uno sensato, piu' margine sulle prime serie.
        e.rir = [...Array(nSets)].map((_,i)=> i < nSets-1 ? 1 : 0);
        changed = true;
      } else if(e.rir.length !== nSets){
        // Serie cambiate dall'editor: allungo ripetendo l'ultimo target, o accorcio.
        const ultimo = e.rir.length ? e.rir[e.rir.length-1] : 1;
        while(e.rir.length < nSets) e.rir.push(ultimo);
        e.rir.length = nSets;
        changed = true;
      }
    });
  });
  if(changed) saveDB();
}
function reconcileExdbRir(){
  let changed=false;
  Object.keys(DEFAULT_EXDB).forEach(g=>{
    if(!DB.exdb || !DB.exdb[g] || !Array.isArray(DB.exdb[g].ex)) return;
    DEFAULT_EXDB[g].ex.forEach(def=>{
      const cur = DB.exdb[g].ex.find(x=>x.k===def.k);
      if(cur && def.rir && (!Array.isArray(cur.rir) || cur.rir.length!==def.rir.length)){
        cur.rir = def.rir.slice(); changed=true;
      }
    });
  });
  if(changed) saveDB();
}
function allMealItemsForDate(dateStr){
  const out = [];
  const log = DB.pianoFissoLog[dateStr] || {};
  const slots = Array.from(new Set(Object.keys(DB.pianoFisso).concat(Object.keys(log))));
  slots.forEach(slot=>{
    const qtys = log[slot] || {};
    const ids = Array.from(new Set(
      (DB.pianoFisso[slot]||[]).map(it=>it.id).concat(Object.keys(qtys))
    ));
    ids.forEach(id=>{
      const qty = Number(qtys[id])||0;
      if(qty<=0) return;
      const item = resolveFissoItem(dateStr, slot, id);
      if(!item) return;
      const label = qty===item.defaultQty ? item.l : `${item.l} ×${qty}`;
      out.push({
        id:"fisso-"+slot+"-"+id, name:label,
        kcal:item.kcalU*qty, pro:item.proU*qty, carb:item.carbU*qty, fat:item.fatU*qty,
        costo:(item.costoU||0)*qty,
        slot, fisso:true
      });
    });
  });
  (DB.meals[dateStr]||[]).forEach(m=> out.push(m));
  return out;
}
function dayCostTotal(dateStr){
  return allMealItemsForDate(dateStr).reduce((s,m)=> s+(Number(m.costo)||0), 0);
}
function dayTotals(dateStr){
  const items = allMealItemsForDate(dateStr);
  return items.reduce((acc,m)=>{
    acc.kcal += Number(m.kcal)||0;
    acc.pro += Number(m.pro)||0;
    acc.carb += Number(m.carb)||0;
    acc.fat += Number(m.fat)||0;
    return acc;
  }, {kcal:0,pro:0,carb:0,fat:0});
}
function setFissoQty(dateStr, slot, itemId, val){
  if(!DB.pianoFissoLog[dateStr]) DB.pianoFissoLog[dateStr] = {};
  if(!DB.pianoFissoLog[dateStr][slot]) DB.pianoFissoLog[dateStr][slot] = {};
  const qty = val==="" ? 0 : Math.max(0, Number(val)||0);
  DB.pianoFissoLog[dateStr][slot][itemId] = qty;
  if(qty>0) snapshotFisso(dateStr, slot, itemId);
  saveDB();
  render();
}

function nutribeesSuggerimenti(){
  const oggi = todayStr();
  const wd = weekdayOf(oggi); // 0=dom..6=sab
  const daysSinceMonday = (wd+6)%7;
  const lunedi = addDays(oggi, -daysSinceMonday);
  const giorniTrascorsi = daysSinceMonday+1;
  let tot = {pro:0,carb:0,fat:0};
  for(let i=0;i<giorniTrascorsi;i++){
    const t = dayTotals(addDays(lunedi,i));
    tot.pro+=t.pro; tot.carb+=t.carb; tot.fat+=t.fat;
  }
  const targetSettimana = {
    pro: DB.targets.pro*giorniTrascorsi,
    carb: DB.targets.carb*giorniTrascorsi,
    fat: DB.targets.fat*giorniTrascorsi,
  };
  const scostamenti = [
    {k:"pro", label:"proteine", pct: targetSettimana.pro>0 ? tot.pro/targetSettimana.pro : 1},
    {k:"carb", label:"carboidrati", pct: targetSettimana.carb>0 ? tot.carb/targetSettimana.carb : 1},
    {k:"fat", label:"grassi", pct: targetSettimana.fat>0 ? tot.fat/targetSettimana.fat : 1},
  ];
  scostamenti.sort((a,b)=>a.pct-b.pct);
  const piuIndietro = scostamenti[0];
  if(piuIndietro.pct >= 0.95) return null;
  const lib = nutribeesLib();
  if(lib.length===0) return null;
  const ordinati = [...lib].sort((a,b)=> b[piuIndietro.k]-a[piuIndietro.k]);
  return { macro: piuIndietro.label, pct: Math.round(piuIndietro.pct*100), piatti: ordinati.slice(0,3) };
}

  const lastDate = doneDates[doneDates.length-1];

function autoMarkDoneIfData(wl){

function lastWorkoutFor(exKey, beforeDate){

}

    <video id="scannerVideo" autoplay playsinline muted style="flex:1;object-fit:cover;width:100%;"></video>
    <div style="padding:14px;background:#151B26;display:flex;flex-direction:column;gap:8px;">
      <div style="text-align:center;font-size:12px;color:#8B93A7;">Inquadra il codice a barre</div>
      <button class="btn block" onclick="closeBarcodeScanner()">Annulla</button>
    </div>`;
  document.body.appendChild(overlay);
  const video = document.getElementById("scannerVideo");
  video.srcObject = scannerStream;
  const detector = new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]});
  const loop = async ()=>{
    if(!document.getElementById("scannerOverlay")) return;
    try{
      const codes = await detector.detect(video);
      if(codes.length>0){
        const code = codes[0].rawValue;
        closeBarcodeScanner();
        lookupBarcode(code);
        return;
      }
    }catch(e){}
    scannerRAF = requestAnimationFrame(loop);
  };
  scannerRAF = requestAnimationFrame(loop);
}
function closeBarcodeScanner(){
  if(scannerRAF) cancelAnimationFrame(scannerRAF);
  scannerRAF = null;
  if(scannerStream){ scannerStream.getTracks().forEach(t=>t.stop()); scannerStream=null; }
  const overlay = document.getElementById("scannerOverlay");
  if(overlay) overlay.remove();
}
async function lookupBarcode(rawCode){
  const code = String(rawCode||"").trim();
  if(!code){ toast("Inserisci un codice a barre"); return; }
  if(DB.barcodeCache[code]){
    barcodeResult = Object.assign({barcode:code, grams:100}, DB.barcodeCache[code]);
    render();
    return;
  }
  toast("Cerco il prodotto...");
  try{
    const resp = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,brands,nutriments`);
    const data = await resp.json();
    if(data.status !== 1 || !data.product){ toast("Prodotto non trovato nel database"); return; }
    const p = data.product;
    const n = p.nutriments || {};
    const kcal100 = n["energy-kcal_100g"];
    if(kcal100===undefined || kcal100===null){ toast("Dati nutrizionali mancanti per questo prodotto"); return; }
    const name = [p.product_name, p.brands].filter(Boolean).join(" — ") || `Prodotto ${code}`;
    const info = {
      name,
      kcal100: Number(kcal100)||0,
      pro100: Number(n["proteins_100g"])||0,
      carb100: Number(n["carbohydrates_100g"])||0,
      fat100: Number(n["fat_100g"])||0,
    };
    DB.barcodeCache[code] = info;
    saveDB();
    barcodeResult = Object.assign({barcode:code, grams:100}, info);
    render();
  }catch(e){
    toast("Errore di connessione — riprova o inserisci a mano");
  }
}

}

}

/* v23 - Tasto Indietro di Android.
   Dentro un'app installata (PWA o TWA) non c'e' barra del browser: senza voci
   nella cronologia, Indietro chiudeva l'app. Ora ogni tab diverso da "Oggi" e'
   una voce di cronologia: Indietro torna a Oggi, e da Oggi esce. Un pannello di
   sostituzione aperto viene chiuso prima di cambiare tab. */
function vaiATab(tab, opts){
  const o = opts || {};
  currentTab = tab;
  if(!o.daPopstate && window.history && history.pushState){
    try{
      if(tab === "allenamento"){
        if(history.state && history.state.tab && history.state.tab !== "allenamento"){ history.back(); return; }
      } else if(history.state && history.state.tab && history.state.tab !== "allenamento"){
        history.replaceState({tab}, "");
      } else {
        history.pushState({tab}, "");
      }
    }catch(e){}
  }
  render(); window.scrollTo(0,0);
}
window.addEventListener("popstate", (ev)=>{
  if(SOST && SOST.slot){ SOST = {slot:null, motivo:null}; }
  const tab = (ev.state && ev.state.tab) || "allenamento";
  vaiATab(tab, {daPopstate:true});
});
try{ if(history.replaceState) history.replaceState({tab:"allenamento"}, ""); }catch(e){}
document.querySelectorAll("nav.tabs button").forEach(b=>{
  b.addEventListener("click", ()=>vaiATab(b.dataset.tab));
});

function renderOggi(app){
  document.getElementById("headerTitle").textContent = "Hustler Fitness";
  document.getElementById("headerSub").textContent = niceDate(todayStr());

  const t = todayStr();
  const yest = addDays(t,-1);
  const totals = dayTotals(t);
  const totalsYest = dayTotals(yest);
  const targets = DB.targets;
  const wlOggi = DB.workoutLog[t];
  const doneOggi = wlOggi && wlOggi.done;
  const giornoOggi = doneOggi ? wlOggi.giorno : computeNextGiorno();

  let banners = "";
  // Il giorno dopo una seduta gambe non ci si allena: e' la regola che tiene in piedi
  // tutto lo schema. E' un avviso, non un blocco.
  const wlIeri = DB.workoutLog[yest];
  if(wlIeri && wlIeri.done && GIORNI_GAMBE.indexOf(wlIeri.giorno) >= 0){
    banners += `<div class="banner bad" style="border-width:2px;"><b>\u{1F6D1} Oggi \u00e8 riposo.</b> Ieri hai fatto <b>${DB.exdb[wlIeri.giorno].label}</b>, e il giorno dopo le gambe non ci si allena. La prossima seduta \u00e8 da domani.</div>`;
  }
  if(totalsYest.kcal>0 && totalsYest.kcal < 1500){
    banners += `<div class="banner bad">⚠️ Ieri sotto le 1500 kcal (${Math.round(totalsYest.kcal)}). Aspettati meno lucidità ed energia nelle call di oggi — recupera con calma, non saltare i prossimi pasti.</div>`;
  }
  const nbAvviso = nutribeesAvviso();
  if(nbAvviso.urgente){
    banners += `<div class="banner bad">⚠️ Scorte Nutribees: ${DB.nutribeesStock||0} pasti rimasti (~${Math.floor(nbAvviso.giorni)} giorni). Con ${DB.nutribeesLeadDays||7} giorni di consegna, ordina ora.</div>`;
  }
  // Promemoria pesata e foto: due avvisi indipendenti, entrambi partono dal lunedì della settimana
  // corrente e restano finché non fai l'azione specifica — non spariscono da soli col cambio di giorno.
  const lunediSettimana = lunediCorrente(t);
  const ritardo = t===lunediSettimana ? "" : ` (dovevi farla lunedì ${niceDate(lunediSettimana)})`;
  const pesoFattoSettimana = DB.pesoLog.some(p=>p.date>=lunediSettimana && p.date<=t);
  if(!pesoFattoSettimana){
    banners += `<div class="banner warn">⚖️ Questa settimana manca ancora la pesata${ritardo}. <button class="btn small" style="margin-top:8px;" onclick="goToProgressi()">Vai a Progressi</button></div>`;
  }
  // La percentuale di grasso serve una volta a settimana: come dato singolo e' rumoroso,
  // e' il trend su piu' settimane che conta. Lo chiedo solo se la pesata c'e' gia',
  // altrimenti sarebbero due avvisi che dicono la stessa cosa.
  const bfFattaSettimana = DB.pesoLog.some(p=>p.date>=lunediSettimana && p.date<=t && typeof p.bf === "number");
  if(pesoFattoSettimana && !bfFattaSettimana){
    banners += `<div class="banner warn">\u{1F4CA} Questa settimana manca la <b>percentuale di grasso</b>. Una lettura basta, sempre nelle stesse condizioni: appena sveglio, a digiuno, dopo il bagno. <button class="btn small" style="margin-top:8px;" onclick="goToProgressi()">Vai a Progressi</button></div>`;
  }
  const fotoFattaSettimana = DB.fotoLog.some(f=>f.date>=lunediSettimana && f.date<=t);
  if(!fotoFattaSettimana){
    banners += `<div class="banner warn">📸 Questa settimana manca ancora la foto progressi${ritardo}. <button class="btn small" style="margin-top:8px;" onclick="goToProgressi()">Vai a Progressi</button></div>`;
  }
  if(!doneOggi){
    banners += `<div class="banner warn">Prossima sessione in coda: <b>${DB.exdb[giornoOggi].label}</b>. Appena inserisci un peso o delle ripetizioni viene segnata fatta e si passa al giorno dopo — se non fai nulla, resta in coda finché non la fai.</div>`;
  } else {
    banners += `<div class="banner ok">Sessione di oggi già segnata: ${DB.exdb[giornoOggi].label} ✅</div>`;
  }
  // streak: giorni di allenamento consecutivi segnati "fatto", scansione a ritroso.
  // Un giorno senza nessuna voce nel log non rompe lo streak (potresti non esserti allenato
  // quel giorno per scelta, senza che sia un salto). Un giorno segnato "saltato" lo rompe.
  let streak = 0;
  for(let i=0;i<90;i++){
    const dd = addDays(t,-i);
    const w = DB.workoutLog[dd];
    if(!w) continue;
    if(w.done) streak++;
    else if(w.skipped) break;
  }

  const last7 = [...Array(7)].map((_,i)=>addDays(t,-i));
  const avgKcal7 = last7.reduce((s,d)=>s+dayTotals(d).kcal,0)/7;

  app.innerHTML = `
    ${banners}
    <div class="card">
      <h2>Target di oggi</h2>
      ${macroBar("Calorie", totals.kcal, targets.kcal, "kcal")}
      ${macroBar("Proteine", totals.pro, targets.pro, "g")}
      ${macroBar("Carboidrati", totals.carb, targets.carb, "g")}
      ${macroBar("Grassi", totals.fat, targets.fat, "g")}
      <div class="row" style="margin-top:8px;">
        <button class="btn primary block" onclick="goToPasti('${t}')">+ Aggiungi pasto</button>
      </div>
    </div>

    <div class="card">
      <h2>Allenamento</h2>
      <div class="row between" style="margin-bottom:8px;">
        <div style="font-size:14px;font-weight:700;">${DB.exdb[giornoOggi].label}</div>
        ${doneOggi ? '<span class="pill ok">Fatto</span>' : '<span class="pill warn">Da fare</span>'}
      </div>
      <button class="btn primary block" onclick="goToAllenamento('${t}')">Apri scheda</button>
    </div>

    <div class="grid3" style="margin-bottom:12px;">
      <div class="stat"><div class="n">${streak}</div><div class="l">giorni streak allenamento</div></div>
      <div class="stat"><div class="n">${Math.round(avgKcal7)}</div><div class="l">kcal medie 7gg</div></div>
      <div class="stat"><div class="n">${DB.pesoLog.length ? DB.pesoLog[DB.pesoLog.length-1].kg+"kg" : "—"}</div><div class="l">ultimo peso</div></div>
    </div>

    <div class="card">
      <h2>Pasti di oggi</h2>
      ${renderMealsList(t, false)}
    </div>
  `;
}
function macroBar(label, val, target, unit){
  const pct = target>0 ? Math.min(100, Math.round((val/target)*100)) : 0;
  let color = "var(--green)";
  if(pct<60) color="var(--amber)";
  if(pct<30) color="var(--red)";
  if(pct>115) color="var(--amber)";
  return `<div class="macro-line">
    <div class="lbl"><b>${label}</b><span>${Math.round(val*10)/10}${unit} / ${target}${unit}</span></div>
    <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${color};"></div></div>
  </div>`;
}

   l'altra passano almeno 48 ore: ogni seduta lavora gambe e glutei, e due giorni

function avvisiPalestra(){
  const oggi = todayStr();
  let out = "";
  if(selDate === oggi){
    const ieri = DB.workoutLog[addDays(oggi,-1)];
    const wlOggi = DB.workoutLog[oggi];
    if(ieri && ieri.done && !(wlOggi && wlOggi.done)){
      const lbl = DB.exdb[ieri.giorno] ? DB.exdb[ieri.giorno].label : "una seduta";
      out += `<div class="banner bad" style="border-width:2px;"><b>\u{1F6D1} Oggi \u00e8 riposo.</b> Ieri hai fatto <b>${lbl}</b>. Fra due allenamenti servono almeno 48 ore: i muscoli crescono mentre recuperano, non mentre ti alleni. La prossima seduta \u00e8 da domani.</div>`;
    }
  }
  const fatte = Object.keys(DB.workoutLog).filter(d=>DB.workoutLog[d] && DB.workoutLog[d].done).length;
  if(fatte < 6){
    out += `<div class="banner warn"><b>Prime 6 sedute: impara i movimenti (${fatte}/6).</b> Scegli carichi con cui chiudi le ripetizioni con margine e tecnica pulita: il peso viene dopo. I numeri di queste settimane diventano il tuo punto di partenza.</div>`;
  }
  return out;
}
