/* ===================== GIORNI GAMBE, ORDINE, TIMER RECUPERO =====================
   GIORNI_GAMBE: nei giorni gambe il cardio non compare proprio, cosi' le gambe
   arrivano al giorno dopo senza fatica aggiuntiva.
   Ordine: e' salvato dentro la sessione del giorno (wl.order), non nella scheda.
   Serve per quando un macchinario e' occupato: sposti l'esercizio solo per oggi
   e domani ritrovi la scheda com'era. Lo storico e' indicizzato per esercizio,
   quindi l'ordine non tocca nessun dato.
   Timer: parte da solo quando registri le ripetizioni di una serie allenante e
   dura quanto dice il campo "rec" di quell'esercizio (180 / 120 / 90 secondi).
================================================================================ */
const GIORNI_GAMBE = [];

/* ===================== SOSTITUZIONE ESERCIZIO =========================
   Un attrezzo occupato o un muscolo ancora indolenzito non devono mandare
   all'aria la seduta ne' sporcare lo storico. La sostituzione vive dentro
   la sessione del giorno, MAI nella scheda:
       wl.sub[slotK] = { k: "<esercizio-fatto>" | "__skip__", motivo }
   I numeri finiscono sotto la chiave dell'esercizio REALMENTE eseguito,
   quindi "Ultima volta" e il suggerimento di carico confrontano sempre lo
   stesso esercizio con se stesso. Lo slot sostituito non riceve nulla:
   il suo prossimo suggerimento guardera' l'ultima volta vera.
   Due motivi, due liste opposte:
     attrezzo  -> altri esercizi per LO STESSO muscolo (il muscolo sta bene)
     recupero  -> il muscolo non va allenato: si salta, oppure si lavora
                  un ALTRO muscolo sapendo che e' volume in piu', non un
                  recupero di quello perso.
====================================================================== */
const MUSCOLO = {
  "hip-thrust":"glutei", "kickback-cavo":"glutei", "abductor":"glutei",
  "leg-press":"quadricipiti", "goblet-squat":"quadricipiti", "affondi-indietro":"quadricipiti",
  "stacco-rumeno":"femorali", "leg-curl":"femorali",
  "lat-machine":"dorso", "lat-stretta":"dorso", "pulley-basso":"dorso",
  "chest-press":"petto",
  "shoulder-press":"spalle", "alzate-laterali":"spalle",
  "crunch-cavo":"addome", "dead-bug":"addome",
};
function muscoloDi(k){ return MUSCOLO[k] || "altro"; }
function exByKey(k){
  for(let g=1; g<=nGiorni(); g++){
    const day = DB.exdb[g];
    if(!day || !Array.isArray(day.ex)) continue;
    const e = day.ex.find(x=>x.k===k);
    if(e) return e;
  }
  return null;
}
// Esercizio da mostrare e su cui registrare per uno slot della giornata.
function exEffettivo(slot, wl){
  const sb = wl && wl.sub && wl.sub[slot.k];
  if(!sb) return {e:slot, sub:null};
  if(sb.k === "__skip__") return {e:null, sub:sb};
  const alt = exByKey(sb.k);
  if(!alt) return {e:slot, sub:null};   // esercizio sparito dalla scheda: si torna all'originale
  return {e:alt, sub:sb};
}
// Chiavi gia' impegnate oggi: due blocchi di serie sulla stessa chiave si
// sovrascriverebbero a vicenda, quindi non si puo' scegliere quello che c'e' gia'.
function chiaviOccupateOggi(giorno, wl, escludiSlot){
  const occ = {};
  orderedEx(giorno, wl).forEach(sl=>{
    if(sl.k === escludiSlot) return;
    const sb = wl.sub && wl.sub[sl.k];
    if(sb && sb.k && sb.k !== "__skip__") occ[sb.k] = true;
    else if(!sb) occ[sl.k] = true;
  });
  return occ;
}
// Giorni dall'ultima volta che quel muscolo ha ricevuto lavoro. 0 = oggi.
function giorniDaMuscolo(muscolo, fino){
  const dates = Object.keys(DB.workoutLog).filter(d=>d <= fino).sort().reverse();
  for(const d of dates){
    const w = DB.workoutLog[d];
    if(!w || !w.pesi) continue;
    const trovato = Object.keys(w.pesi).some(k=>
      muscoloDi(k) === muscolo && Array.isArray(w.pesi[k])
      && w.pesi[k].some(v=>v!=="" && v!==undefined && v!==null));
    if(trovato) return Math.round((new Date(fino) - new Date(d)) / 86400000);
  }
  return null;
}
// Fra quante SEDUTE quel muscolo torna in programma (1 = la prossima).
// Conto sedute e non giorni: il ciclo e' ancorato agli allenamenti fatti,
// non al calendario, quindi i giorni non li so.
function sedutePrimaDi(muscolo, giornoCorrente){
  let g = Number(giornoCorrente) || 1;
  for(let i=1; i<=nGiorni(); i++){
    g = (g % nGiorni()) + 1;
    const day = DB.exdb[g];
    if(day && Array.isArray(day.ex) && day.ex.some(e=>muscoloDi(e.k)===muscolo)) return {gap:i, giorno:g};
  }
  return null;
}
function candidatiSost(slotK, motivo, giorno, wl){
  const mio = muscoloDi(slotK);
  const occ = chiaviOccupateOggi(giorno, wl, slotK);
  const out = [];
  const visti = {};
  for(let g=1; g<=nGiorni(); g++){
    const day = DB.exdb[g];
    if(!day || !Array.isArray(day.ex)) continue;
    day.ex.forEach(e=>{
      if(e.k === slotK || occ[e.k] || visti[e.k]) return;
      visti[e.k] = true;
      const m = muscoloDi(e.k);
      if(motivo === "attrezzo"){ if(m !== mio) return; }
      else { if(m === mio) return; }
      out.push(e);
    });
  }
  if(motivo === "recupero"){
    out.forEach(e=>{
      e.__gg = giorniDaMuscolo(muscoloDi(e.k), selDate);
      const nx = sedutePrimaDi(muscoloDi(e.k), giorno);
      e.__gap = nx ? nx.gap : 9;
      e.__warn = (e.__gg === 0) || e.__gap <= 2;
    });
    out.sort((a,b)=>{
      if(a.__warn !== b.__warn) return a.__warn ? 1 : -1;
      const ga = a.__gg===null ? 999 : a.__gg, gb = b.__gg===null ? 999 : b.__gg;
      if(ga !== gb) return gb - ga;
      return b.__gap - a.__gap;
    });
  }
  return out;
}
var SOST = { slot:null, motivo:null };
function apriSost(slotK){ SOST = {slot:slotK, motivo:null}; render(); }
function chiudiSost(){ SOST = {slot:null, motivo:null}; render(); }
function setMotivoSost(m){ SOST.motivo = m; render(); }
function applicaSost(slotK, newK, motivo){
  const wl = ensureWL();
  if(!wl.sub) wl.sub = {};
  wl.sub[slotK] = {k:newK, motivo:motivo};
  SOST = {slot:null, motivo:null};
  saveDB();
  toast(newK === "__skip__" ? "Esercizio saltato per oggi" : "Sostituito solo per oggi");
  render();
}
function annullaSost(slotK){
  const wl = ensureWL();
  if(wl.sub) delete wl.sub[slotK];
  SOST = {slot:null, motivo:null};
  saveDB(); toast("Sostituzione annullata"); render();
}
function etichettaMotivo(m){
  return m === "attrezzo" ? "attrezzo non disponibile" : "muscolo non ancora recuperato";
}
function pannelloSost(slot, giorno, wl){
  if(!SOST.motivo){
    return `<div class="sostbox">
      <div class="sosttitle">Perche\u0301 cambi?</div>
      <button class="btn small block" onclick="setMotivoSost('attrezzo')">Attrezzo occupato o non disponibile</button>
      <button class="btn small block" onclick="setMotivoSost('recupero')">Muscolo non ancora recuperato</button>
      <button class="btn small ghost block" onclick="chiudiSost()">Annulla</button>
    </div>`;
  }
  const mio = muscoloDi(slot.k);
  const cand = candidatiSost(slot.k, SOST.motivo, giorno, wl);
  if(SOST.motivo === "attrezzo"){
    if(!cand.length){
      return `<div class="sostbox">
        <div class="sosttitle">Nessuna alternativa in scheda per ${mio}</div>
        <div class="sostnote">Fermati e recupera: aspetta che si liberi e poi fai l'esercizio come da scheda.
        Non c'e\u0300 un altro esercizio in scheda che alleni ${mio} senza doppiare qualcosa di oggi.</div>
        <button class="btn small ghost block" onclick="applicaSost('${slot.k}','__skip__','attrezzo')">Non riesco proprio: segna come saltato</button>
        <button class="btn small ghost block" onclick="chiudiSost()">Annulla</button>
      </div>`;
    }
    return `<div class="sostbox">
      <div class="sosttitle">Stesso muscolo &mdash; ${mio}</div>
      ${cand.map(c=>`<button class="btn small block" onclick="applicaSost('${slot.k}','${c.k}','attrezzo')">
        <b>${c.l}</b><span class="sostmeta">${c.sets} serie \u00d7 ${c.repMin===c.repMax ? c.repMin : c.repMin+"-"+c.repMax} ripetizioni</span>
      </button>`).join("")}
      <button class="btn small ghost block" onclick="chiudiSost()">Annulla</button>
    </div>`;
  }
  const righe = cand.map(c=>{
    const m = muscoloDi(c.k);
    const gg = c.__gg;
    const quando = gg === null ? "mai allenato finora"
      : gg === 0 ? "gia\u0300 allenato oggi"
      : gg === 1 ? "ultima volta ieri"
      : "ultima volta " + gg + " giorni fa";
    const nxt = c.__gap >= 9 ? "" : (c.__gap === 1 ? " \u00b7 torna in programma alla prossima seduta"
      : " \u00b7 torna in programma fra " + c.__gap + " sedute");
    return `<button class="btn small block ${c.__warn ? "warnpick" : ""}" onclick="applicaSost('${slot.k}','${c.k}','recupero')">
      <b>${c.l}</b> <span class="mus">${m}</span>
      <span class="sostmeta">${c.__warn ? "\u26a0\ufe0f " : ""}${quando}${nxt}</span>
    </button>`;
  }).join("");
  return `<div class="sostbox">
    <button class="btn small block consigliato" onclick="applicaSost('${slot.k}','__skip__','recupero')">
      <b>Salto e basta</b>
      <span class="sostmeta">Consigliato: il volume su un altro muscolo non recupera quello perso, e spesso ruba freschezza alla seduta in cui era programmato</span>
    </button>
    <div class="sosttitle">Oppure allena un altro muscolo</div>
    ${righe || `<div class="sostnote">Nessun altro esercizio disponibile oggi.</div>`}
    <button class="btn small ghost block" onclick="chiudiSost()">Annulla</button>
  </div>`;
}

/* ===================== SUGGERIMENTO CARICO (doppia progressione) =====================
   Regola: si sale di peso solo quando l'ultima volta hai chiuso TUTTE le serie allenanti
   al massimo del range di ripetizioni E con un RIR pari o inferiore al target.
   Se le ripetizioni erano al massimo ma il RIR non l'hai segnato, l'app non puo' sapere
   se eri vicino al cedimento: te lo dice invece di indovinare.
=================================================================================== */
function arrotondaAlPasso(v, passo){
  const p = passo || 2.5;
  return Math.round(v / p) * p;
}
function suggerimentoCarico(e, prev){
  if(!prev) return null;
  const kg = prev.kg || [], reps = prev.reps || [], rir = prev.rir || [];
  const bw = !!e.bw; // corpo libero: conta solo ripetizioni e RIR
  const pieno = i => (bw || (kg[i]!==undefined && kg[i]!=="" && kg[i]!==null))
                  && reps[i]!==undefined && reps[i]!=="" && reps[i]!==null;
  const serie = [];
  for(let i=0; i<e.sets; i++){ if(pieno(i)) serie.push(i); }
  if(!serie.length) return null;
  if(serie.length < e.sets){
    return { t:"info", txt:"Ultima volta hai registrato " + serie.length + " serie su " + e.sets + ": nessun suggerimento" };
  }
  const passo = e.step || 2.5;
  const carico = Number(kg[serie[serie.length-1]]);
  const target = Array.isArray(e.rir) ? e.rir : [];
  const alMax = serie.every(i => Number(reps[i]) >= e.repMax);
  const sotto = serie.filter(i => Number(reps[i]) < e.repMin).length;
  const rirMancante = serie.some(i => rir[i]===undefined || rir[i]==="" || rir[i]===null);
  const rirOk = serie.every(i => {
    if(target[i]===undefined) return true;
    if(rir[i]===undefined || rir[i]==="" || rir[i]===null) return false;
    return Number(rir[i]) <= Number(target[i]);
  });

  // --- Senza RIR non si consiglia niente ---
  // Le sole ripetizioni dicono dove sei arrivato, non come ci sei arrivato: otto
  // ripetizioni a RIR 0 e otto a RIR 4 chiedono due decisioni diverse sul carico.
  // Finche' il RIR non c'e', l'app tace invece di dedurre.
  if(rirMancante){
    return { t:"info", txt:"Manca il RIR nella sessione precedente: nessun suggerimento" };
  }

  // --- Corpo libero: si progredisce con le ripetizioni e poi con la difficolta' ---
  if(bw){
    if(serie.every(i => Number(reps[i]) >= e.repMax) && rirOk){
      return { t:"su", txt:"Tutte le serie al massimo: la prossima volta scendi piu\u0300 lenta (3 secondi) o tieni un manubrio leggero in mano" };
    }
    return { t:"resta", txt:"Punta a " + e.repMax + " ripetizioni su tutte le serie, con il RIR di target" };
  }

  // --- CASO 1: sotto il minimo del range su piu' serie ---
  // Il RIR distingue due problemi opposti: carico davvero troppo alto (hai spinto
  // fino in fondo e le ripetizioni non ci sono) da sforzo insufficiente (ti sei
  // fermato presto). Togliere peso nel secondo caso e' il consiglio sbagliato.
  if(sotto >= 2){
    if(rirOk){
      return { t:"giu", txt:"Carico troppo alto: scendi a " + arrotondaAlPasso(carico*0.95, passo) + " kg" };
    }
    return { t:"forse", txt:"Il carico non e\u0300 il problema: ti sei fermato presto. Resta a "
      + carico + " kg e arriva al RIR di target" };
  }

  // --- CASO 2: tutte le serie al massimo del range ---
  // Si sale sempre. Il salto cresce se hai superato di molto il tetto delle ripetizioni:
  // vuol dire che il carico era leggero e un solo scalino non basta a riportarti nel range.
  if(alMax){
    const minReps = Math.min.apply(null, serie.map(i=>Number(reps[i])));
    const oltre = minReps - e.repMax;
    const mult = oltre >= 6 ? 3 : (oltre >= 3 ? 2 : 1);
    const nuovo = carico + passo*mult;
    if(!rirOk){
      return { t:"su", txt:"Massimo del range con RIR sopra il target: carico leggero, sali a " + nuovo + " kg (+" + (passo*mult) + ")" };
    }
    return { t:"su", txt:"Sali a " + nuovo + " kg (+" + (passo*mult) + ")" };
  }

  // --- CASO 3: dentro il range ---
  if(!rirOk){
    return { t:"resta", txt:"Resta a " + carico + " kg: le ripetizioni non sono al massimo e il RIR e\u0300 sopra il target, quindi c'e\u0300 margine per spingere" };
  }
  return { t:"resta", txt:"Resta a " + carico + " kg, punta a " + e.repMax + " ripetizioni su tutte le serie" };
}

function orderedEx(giorno, wl){
  const base = (DB.exdb[giorno] && Array.isArray(DB.exdb[giorno].ex)) ? DB.exdb[giorno].ex : [];
  const ord = (wl && Array.isArray(wl.order)) ? wl.order : null;
  if(!ord || !ord.length) return base.slice();
  const pos = k => { const i = ord.indexOf(k); return i < 0 ? 999 : i; };
  return base.slice().sort((a,b)=> pos(a.k) - pos(b.k));
}
function moveExercise(dir, exKey){
  const wl = ensureWL();
  const giorno = wl.giorno || computeNextGiorno();
  const cur = orderedEx(giorno, wl).map(e=>e.k);
  const i = cur.indexOf(exKey), j = i + dir;
  if(i < 0 || j < 0 || j >= cur.length) return;
  cur.splice(j, 0, cur.splice(i, 1)[0]);
  wl.order = cur;
  saveDB(); render();
}
function resetOrdine(){
  const wl = ensureWL();
  delete wl.order;
  saveDB(); toast("Ordine ripristinato"); render();
}
function recForEx(exKey, giorno){
  // L'esercizio puo' arrivare da un altro giorno della scheda (sostituzione),
  // quindi se non e' nella giornata corrente lo cerco ovunque.
  const day = DB.exdb[giorno];
  let e = day ? (day.ex||[]).find(x=>x.k===exKey) : null;
  if(!e) e = exByKey(exKey);
  return (e && e.rec) ? e.rec : 120;
}
function recLabel(sec){
  const m = Math.floor(sec/60), r = sec%60;
  return r ? (m + ":" + String(r).padStart(2,"0")) : (m + " min");
}

let REST = { endsAt:0, total:0, label:"", timerId:null, beeped:false };
function fmtSec(sec){
  const m = Math.floor(sec/60), r = sec%60;
  return m + ":" + String(r).padStart(2,"0");
}
function startRest(seconds, label){
  REST.total = seconds;
  REST.endsAt = Date.now() + seconds*1000;
  REST.label = label || "";
  REST.beeped = false;
  programmaBeep(seconds);
  const el = document.getElementById("restTimer");
  if(el) el.classList.add("show");
  if(REST.timerId) clearInterval(REST.timerId);
  REST.timerId = setInterval(tickRest, 250);
  tickRest();
}
function tickRest(){
  const el = document.getElementById("restTimer");
  if(!el) return;
  const left = Math.max(0, Math.round((REST.endsAt - Date.now())/1000));
  const t = el.querySelector(".t"), lbl = el.querySelector(".lbl"), bar = el.querySelector(".bar");
  if(t) t.textContent = fmtSec(left);
  if(lbl) lbl.textContent = left === 0 ? ("Pronto \u2014 " + REST.label) : REST.label;
  if(bar) bar.style.width = REST.total ? Math.max(0, left/REST.total*100) + "%" : "0%";
  el.classList.toggle("done", left === 0);
  if(left === 0 && !REST.beeped){
    REST.beeped = true;
    restAlert();
    // il timer resta visibile a zero: lo chiudi tu, o riparte alla serie dopo
    if(REST.timerId){ clearInterval(REST.timerId); REST.timerId = null; }
  }
}
/* ===================== SUONERIA ANCHE A SCHERMO SPENTO =====================
   Quando blocchi lo schermo o cambi app, il browser congela i timer JavaScript:
   un suono "fatto partire allo scadere" non partirebbe mai. Quindi il suono NON
   viene deciso alla fine, viene PROGRAMMATO all'inizio del recupero dentro il
   motore audio, al secondo esatto. In piu' resta in riproduzione una traccia
   silenziosa: finche' una scheda sta emettendo audio il browser non la sospende,
   ed e' cio' che tiene in vita la programmazione.
   Non e' garantito al 100% come una sveglia di sistema: se Android chiude del
   tutto la scheda, non suona. Nell'uso normale in palestra funziona.
=========================================================================== */
let AUDIO = { ctx:null, silenzio:null, beep:[] };
/* iPhone: Safari fa partire l'audio solo dopo un tocco dell'utente, e con il tasto
   silenzioso attivo tace. audioSession "playback" (iOS 16.4+) lo fa suonare lo stesso;
   il primo tocco sullo schermo sblocca il motore audio, cosi' il beep di fine
   recupero e' gia' pronto quando serve. */
try{ if(navigator.audioSession) navigator.audioSession.type = "playback"; }catch(e){}
document.addEventListener("touchend", function sbloccaAudio(){ ensureAudio(); }, {passive:true});
document.addEventListener("click", function sbloccaAudioClick(){ ensureAudio(); }, {passive:true});
function ensureAudio(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    if(!AUDIO.ctx) AUDIO.ctx = new AC();
    if(AUDIO.ctx.state === "suspended") AUDIO.ctx.resume();
    return AUDIO.ctx;
  }catch(e){ return null; }
}
function avviaSilenzio(ctx){
  if(AUDIO.silenzio) return;
  try{
    const buf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const src = ctx.createBufferSource();
    src.buffer = buf; src.loop = true;
    const g = ctx.createGain(); g.gain.value = 0.002;
    src.connect(g); g.connect(ctx.destination);
    src.start();
    AUDIO.silenzio = src;
  }catch(e){}
}
function fermaSilenzio(){
  try{ if(AUDIO.silenzio) AUDIO.silenzio.stop(); }catch(e){}
  AUDIO.silenzio = null;
}
function annullaBeep(){
  (AUDIO.beep||[]).forEach(o=>{ try{ o.stop(); }catch(e){} });
  AUDIO.beep = [];
}
function programmaBeep(secondi){
  const ctx = ensureAudio();
  if(!ctx) return;
  avviaSilenzio(ctx);
  annullaBeep();
  const t0 = ctx.currentTime + Math.max(0, secondi);
  for(let k=0; k<3; k++){
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = (k===2) ? 1175 : 880;
    osc.connect(gain); gain.connect(ctx.destination);
    const s0 = t0 + k*0.42;
    gain.gain.setValueAtTime(0.0001, s0);
    gain.gain.exponentialRampToValueAtTime(0.55, s0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, s0 + 0.34);
    osc.start(s0); osc.stop(s0 + 0.36);
    AUDIO.beep.push(osc);
  }
}
function restAlert(){
  // il suono e' gia' programmato: qui resta solo la vibrazione, che funziona
  // unicamente se lo schermo e' acceso e l'app in primo piano.
  try{ if(navigator.vibrate) navigator.vibrate([300,120,300]); }catch(e){}
  setTimeout(fermaSilenzio, 6000);
}
function addRest(sec){
  if(!REST.total) return;
  REST.endsAt += sec*1000;
  REST.total += sec;
  REST.beeped = false;
  programmaBeep(Math.max(0, (REST.endsAt - Date.now())/1000));
  if(!REST.timerId) REST.timerId = setInterval(tickRest, 250);
  tickRest();
}
function stopRest(){
  annullaBeep(); fermaSilenzio();
  if(REST.timerId){ clearInterval(REST.timerId); REST.timerId = null; }
  REST.total = 0; REST.endsAt = 0;
  const el = document.getElementById("restTimer");
  if(el){ el.classList.remove("show"); el.classList.remove("done"); }
}

/* ===================== NOTE ESERCIZIO (v21) =====================
   Due note diverse, in due posti diversi:
   1) Nota FISSA dell'esercizio -> DB.exNote[k] = {txt, links:[{u,t}]}
      Consigli di esecuzione e video YouTube. Vive FUORI dalla scheda:
      la migrazione della scheda sostituisce l'intera DB.exdb e le
      cancellerebbe. Nessuna migrazione tocca DB.exNote.
   2) Nota della SEDUTA -> wl.exNota[k] = {txt, tec}
      Legata a quel giorno: spiega un carico cambiato. tec = true e' il
      tasto rapido "Carico abbassato per l'esecuzione", filtrabile nelle
      analisi. Si rivede nella seduta dopo, sotto "Ultima volta", e nello
      storico dell'esercizio in Progressi.
   Entrambe usano la chiave dell'esercizio FATTO (e.k): se lo sostituisci,
   la nota segue l'esercizio vero, come i numeri.
   Lo stato "aperto/chiuso" dei riquadri non e' un dato: sta in memoria.
================================================================= */
function notaUI(){
  if(!window.__notaUI) window.__notaUI = {fissaAperta:{}, oggiAperta:{}, romAperta:{}};
  if(!window.__notaUI.romAperta) window.__notaUI.romAperta = {};
  return window.__notaUI;
}
function escH(v){
  return String(v==null?"":v).replace(/&/g,"&amp;").replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function notaFissa(k){
  const n = DB.exNote && DB.exNote[k];
  return {
    txt: (n && typeof n.txt === "string") ? n.txt : "",
    links: (n && Array.isArray(n.links)) ? n.links.filter(l => l && l.u) : []
  };
}
function salvaNotaFissa(k, n){
  if(!DB.exNote || typeof DB.exNote !== "object") DB.exNote = {};
  if(!n.txt.trim() && !n.links.length) delete DB.exNote[k];
  else DB.exNote[k] = {txt:n.txt, links:n.links};
  saveDB();
}
function setNotaFissaTxt(k, val){
  const n = notaFissa(k);
  n.txt = String(val||"");
  salvaNotaFissa(k, n);
}
function normalizzaLink(u){
  u = String(u||"").trim();
  if(!u) return "";
  if(!/^https?:\/\//i.test(u)) u = "https://" + u;
  try{
    const x = new URL(u);
    if(x.protocol !== "http:" && x.protocol !== "https:") return "";
    if(!x.hostname || x.hostname.indexOf(".") < 0) return "";
    return x.href;
  }catch(e){ return ""; }
}
function etichettaVideo(l, i){
  if(l.t && l.t.trim()) return l.t.trim();
  let yt = false;
  try{ yt = /(^|\.)youtube\.com$|(^|\.)youtu\.be$/i.test(new URL(l.u).hostname); }catch(e){}
  return (yt ? "Video YouTube " : "Video ") + (i+1);
}
function aggiungiVideo(k){
  const uEl = document.getElementById("vidU_"+k);
  const u = normalizzaLink(uEl ? uEl.value : "");
  if(!u){ toast("Link non valido: incolla l'indirizzo del video"); return; }
  const n = notaFissa(k);
  // Salva anche il testo scritto e non ancora confermato, altrimenti il render lo perde.
  const tx = document.getElementById("notaF_"+k);
  if(tx) n.txt = tx.value;
  n.links = n.links.concat([{u, t: ""}]);
  salvaNotaFissa(k, n);
  const txO = document.getElementById("notaO_"+k);
  if(txO && txO.value !== notaSeduta(DB.workoutLog[selDate], k).txt) setNotaOggiTxt(k, txO.value);
  notaUI().fissaAperta[k] = true;
  toast("Video aggiunto");
  render();
}
function togliVideo(k, i){
  const n = notaFissa(k);
  if(!n.links[i]) return;
  if(!confirm('Togliere "' + etichettaVideo(n.links[i], i) + '" dalle note?')) return;
  const tx = document.getElementById("notaF_"+k);
  if(tx) n.txt = tx.value;
  n.links = n.links.filter((_, j) => j !== i);
  salvaNotaFissa(k, n);
  notaUI().fissaAperta[k] = true;
  render();
}
function notaSeduta(wl, k){
  const n = wl && wl.exNota && wl.exNota[k];
  return { txt: (n && typeof n.txt === "string") ? n.txt : "", tec: !!(n && n.tec) };
}
function salvaNotaSeduta(k, n){
  const wl = ensureWL();
  if(!wl.exNota || typeof wl.exNota !== "object") wl.exNota = {};
  if(!n.txt.trim() && !n.tec) delete wl.exNota[k];
  else wl.exNota[k] = {txt:n.txt, tec:n.tec};
  saveDB();
}
function setNotaOggiTxt(k, val){
  const n = notaSeduta(DB.workoutLog[selDate], k);
  n.txt = String(val||"");
  salvaNotaSeduta(k, n);
}
function toggleTecnica(k){
  const n = notaSeduta(DB.workoutLog[selDate], k);
  const tx = document.getElementById("notaO_"+k);
  if(tx) n.txt = tx.value;
  n.tec = !n.tec;
  salvaNotaSeduta(k, n);
  notaUI().fissaAperta[k] = true;
  render();
}
function apriNotaOggi(k){
  notaUI().oggiAperta[k] = true;
  render();
  setTimeout(() => { const el = document.getElementById("notaO_"+k); if(el) el.focus(); }, 30);
}
function notaSedutaPiena(n){ return !!(n && (n.tec || (n.txt||"").trim())); }
// Una riga leggibile, per "Ultima volta" e per lo storico in Progressi.
function testoNotaSeduta(n){
  const parts = [];
  if(n.tec) parts.push("<b>Carico abbassato per l'esecuzione</b>");
  if((n.txt||"").trim()) parts.push(escH(n.txt.trim()));
  return parts.join(" \u2014 ");
}

/* v28 - Esercizi registrati in una giornata che non stanno piu' negli slot di quel giorno.
   Succede quando la scheda cambia DOPO che la seduta e' gia' stata registrata: il 17/9/2026
   col chest fly, il 23/9/2026 con l'hip thrust quando il G5 e' diventato un altro giorno.
   I dati non si sono mai persi (vivono in workoutLog, indicizzati per esercizio) ma
   sparivano dalla vista del giorno, perche' le righe si costruiscono dagli slot della
   scheda ATTUALE. Qui tornano in fondo alla giornata, in sola lettura.
   Lo stesso principio di exerciseDefsFuoriScheda in Progressi, applicato alla singola seduta. */
function registratiFuoriSlot(wl, ordinati){
  if(!wl) return [];
  const mostrate = {};
  (ordinati||[]).forEach(slot=>{
    mostrate[slot.k] = true;
    const eff = exEffettivo(slot, wl);
    if(eff && eff.e) mostrate[eff.e.k] = true;
  });
  const pieno = v => Array.isArray(v) && v.some(x=>x!=="" && x!==null && x!==undefined);
  const chiavi = Object.keys((wl.pesi)||{}).concat(Object.keys((wl.repsLog)||{}));
  return chiavi
    .filter((k,i,arr)=> arr.indexOf(k)===i)
    .filter(k=> !mostrate[k] && (pieno(wl.pesi && wl.pesi[k]) || pieno(wl.repsLog && wl.repsLog[k])))
    .sort();
}
function bloccoFuoriSlot(wl, ordinati){
  const extra = registratiFuoriSlot(wl, ordinati);
  if(!extra.length) return "";
  const vuoto = x => x==="" || x===null || x===undefined;
  const righe = extra.map(k=>{
    const def = exByKey(k);
    const nome = def ? def.l : etichettaChiave(k);
    const kg = (wl.pesi && wl.pesi[k]) || [];
    const rp = (wl.repsLog && wl.repsLog[k]) || [];
    const ri = (wl.rirLog && wl.rirLog[k]) || [];
    const serie = [];
    for(let i=0; i<Math.max(kg.length, rp.length); i++){
      if(vuoto(kg[i]) && vuoto(rp[i])) continue;
      serie.push((vuoto(kg[i]) ? "\u2013" : kg[i] + " kg")
        + " \u00d7 " + (vuoto(rp[i]) ? "\u2013" : rp[i])
        + (vuoto(ri[i]) ? "" : " \u00b7 RIR " + ri[i]));
    }
    return `<div class="exercise">
      <div class="exhead"><div class="exname">${escH(nome)}</div></div>
      <div class="target">Registrato in questa giornata, non e' piu' fra i suoi esercizi</div>
      <div class="prev">${escH(serie.join("   \u00b7   "))}</div>
    </div>`;
  }).join("");
  return `<h3 class="section">Registrati quel giorno</h3>`
    + `<div class="banner warn" style="margin-bottom:10px;">Questi esercizi li avevi fatti quando la scheda era diversa. I dati sono salvi: restano qui e nello storico in Progressi.</div>`
    + righe;
}
function renderExerciseList(giorno, wl){
  const el = document.getElementById("exerciseList");
  const info = DB.exdb[giorno];
  const ordinati = orderedEx(giorno, wl);
  const ordineCustom = Array.isArray(wl.order) && wl.order.length;
  const nSost = wl.sub ? Object.keys(wl.sub).length : 0;
  el.innerHTML = `<h3 class="section">${info.label}</h3>`
    + (ordineCustom ? `<div class="banner warn" style="margin-bottom:10px;">Ordine cambiato solo per oggi. La scheda non e' stata toccata. <button class="btn small" style="margin-top:8px;" onclick="resetOrdine()">Ripristina ordine</button></div>` : "")
    + (nSost ? `<div class="banner warn" style="margin-bottom:10px;">${nSost === 1 ? "Un esercizio sostituito" : nSost + " esercizi sostituiti"} solo per oggi. La scheda non e' stata toccata.</div>` : "")
    + ordinati.map(slot=>{
    // Lo slot e' la casella della scheda; l'esercizio mostrato puo' essere un
    // altro, se oggi l'hai sostituito. I dati seguono sempre l'esercizio fatto.
    const eff = exEffettivo(slot, wl);
    const sub = eff.sub;
    const pannello = (SOST.slot === slot.k) ? pannelloSost(slot, giorno, wl) : "";

    if(sub && sub.k === "__skip__"){
      return `<div class="exercise skipped">
        <div class="exhead"><div class="exname">${slot.l}</div></div>
        <div class="alt">
          <span class="subbadge skip">Saltato oggi &mdash; ${etichettaMotivo(sub.motivo)}</span>
          <button class="btn small ghost" onclick="annullaSost('${slot.k}')">Annulla</button>
        </div>
      </div>`;
    }

    const e = eff.e;
    const prev = lastWorkoutFor(e.k, addDays(selDate,-1));
    const curKg = (wl.pesi && Array.isArray(wl.pesi[e.k])) ? wl.pesi[e.k] : [];
    const curReps = (wl.repsLog && Array.isArray(wl.repsLog[e.k])) ? wl.repsLog[e.k] : [];
    const curRir = (wl.rirLog && Array.isArray(wl.rirLog[e.k])) ? wl.rirLog[e.k] : [];
    const curWk = (wl.warmKg && Array.isArray(wl.warmKg[e.k])) ? wl.warmKg[e.k] : [];
    const curWr = (wl.warmReps && Array.isArray(wl.warmReps[e.k])) ? wl.warmReps[e.k] : [];
    const repLabel = e.repMin===e.repMax ? `${e.repMin}` : `${e.repMin}-${e.repMax}`;

    // Massimo due avvicinamenti: non contano come serie allenanti, non entrano

    const nWarm = e.warm===undefined ? 2 : Math.max(0, Math.min(2, e.warm));
    const warmRows = [...Array(nWarm)].map((_,i)=>{
      const wkV = curWk[i]!==undefined && curWk[i]!==null ? curWk[i] : "";

        <span class="x">\u00d7</span>
        <input type="number" id="sf_warmReps_${e.k}_${i}" inputmode="numeric" placeholder="${nWarm===1 ? 6 : (i===0?8:5)}" value="${wrV}" onchange="setSetField('${e.k}','warmReps',${i},this.value)">
        <span class="warmtag">non conta</span>
      </div>`;
    }).join("");
    const setRows = [...Array(e.sets)].map((_,i)=>{
      const kgV = curKg[i]!==undefined && curKg[i]!==null ? curKg[i] : "";
      const repV = curReps[i]!==undefined && curReps[i]!==null ? curReps[i] : "";
      const kgPh = prev && prev.kg[i]!==undefined && prev.kg[i]!==null && prev.kg[i]!=="" ? prev.kg[i] : (e.bw ? "—" : "kg");
      const repPh = prev && prev.reps[i]!==undefined && prev.reps[i]!==null && prev.reps[i]!=="" ? prev.reps[i] : "rip";
      const rirV = curRir[i]!==undefined && curRir[i]!==null ? curRir[i] : "";
      const rirPh = rirTarget[i]!==undefined ? "RIR "+rirTarget[i] : "RIR";
      return `<div class="setrow">
        <div class="setlabel">Serie ${i+1}</div>

        <span class="x">\u00d7</span>
        <input type="number" id="sf_repsLog_${e.k}_${i}" inputmode="numeric" placeholder="${repPh}" value="${repV}" onchange="setSetField('${e.k}','repsLog',${i},this.value)">
        <input class="${classeRir(rirV, rirTarget[i])}" id="sf_rirLog_${e.k}_${i}" type="number" inputmode="numeric" min="0" max="5" placeholder="${rirPh}" value="${rirV}" onchange="setSetField('${e.k}','rirLog',${i},this.value)">
      </div>`;
    }).join("");
    const rom = ROM_INFO[e.k];
    const romHtml = rom ? `<details class="rom" ${notaUI().romAperta[e.k] ? "open" : ""} ontoggle="notaUI().romAperta['${e.k}']=this.open">
        <summary>Esecuzione e ROM</summary>
        <div class="rombody">
          <div class="r"><div class="k">Allungamento</div><div>${rom.all}</div></div>
          <div class="r"><div class="k">Accorciamento</div><div>${rom.acc}</div></div>
          ${rom.tempo ? `<div class="r"><div class="k">Tempo</div><div>${rom.tempo}</div></div>` : ""}
          ${rom.err ? `<div class="err">Errore tipico: ${rom.err}</div>` : ""}
        </div>
      </details>` : "";
    // v22 - UNA sola sezione "Note" sotto "Esecuzione e ROM". Dentro:
    //   - come eseguirlo (resta sempre)       -> DB.exNote[k].txt
    //   - video, facoltativi (restano sempre) -> DB.exNote[k].links
    //   - questa seduta: spunta "carico abbassato per l'esecuzione"
    //     e riga libera facoltativa           -> wl.exNota[k] = {tec, txt}
    // I dati restano separati (la spunta e' della seduta, il consiglio no):
    // cambia solo dove li scrivi.
    const nf = notaFissa(e.k);
    const ns = notaSeduta(wl, e.k);
    const nsPiena = notaSedutaPiena(ns);
    const nfPiena = !!(nf.txt.trim() || nf.links.length);
    const notePiena = nfPiena || nsPiena;
    const nsParti = [];
    if(nf.txt.trim()) nsParti.push("✎");
    if(nf.links.length) nsParti.push("▶ " + nf.links.length);
    if(ns.tec) nsParti.push("↓ carico oggi");
    else if(ns.txt.trim()) nsParti.push("oggi ✎");
    const nfSummary = notePiena ? "Note " + nsParti.join(" · ") : "+ Note";
    const nfLinks = nf.links.map((l, i) => `<div class="vidrow">
          <a class="vid" href="${escH(l.u)}" target="_blank" rel="noopener">▶ ${escH(etichettaVideo(l, i))}</a>
          <button class="btn small ghost" onclick="togliVideo('${e.k}',${i})" title="Togli video">×</button>
        </div>`).join("");
    const notaFissaHtml = `<details class="rom mynote${notePiena ? " piena" : ""}" ${notaUI().fissaAperta[e.k] ? "open" : ""} ontoggle="notaUI().fissaAperta['${e.k}']=this.open">
        <summary>${nfSummary}</summary>
        <div class="rombody">
          <div class="notelbl">Come eseguirlo</div>
          <textarea id="notaF_${e.k}" rows="3" placeholder="Consigli ricevuti, punti da ricordare..." onchange="setNotaFissaTxt('${e.k}', this.value)">${escH(nf.txt)}</textarea>
          <div class="notelbl">Video <span class="facolt">facoltativo</span></div>
          ${nfLinks}
          <div class="vidadd">
            <input class="u" id="vidU_${e.k}" type="url" inputmode="url" placeholder="Incolla il link">
            <button class="btn small" onclick="aggiungiVideo('${e.k}')">+ Aggiungi</button>

          <button class="chiptec${ns.tec ? " on" : ""}" onclick="toggleTecnica('${e.k}')"><span class="box">${ns.tec ? "✓" : ""}</span>Carico abbassato per l'esecuzione</button>

    // v21 - nota lasciata nella seduta precedente
    const pn = prev && prev.nota ? notaSeduta({exNota:{x:prev.nota}}, "x") : null;
    const prevNotaHtml = notaSedutaPiena(pn) ? `<div class="prevnota">${testoNotaSeduta(pn)}</div>` : "";
    const sugg = suggerimentoCarico(e, prev);
    const suggHtml = sugg ? `<div class="sugg ${sugg.t}">${sugg.t==="su"?"\u2191":sugg.t==="giu"?"\u2193":sugg.t==="forse"?"?":"\u2192"} ${sugg.txt}</div>` : "";
    const prevText = prev
      ? `<span class="prevlabel">Ultima volta: ${niceDate(prev.date)}</span>`
      : `<span class="prevlabel">Nessun dato precedente</span>`;
    const recSec = e.rec || 120;
    const piede = sub
      ? `<span class="subbadge">Al posto di ${slot.l} &mdash; ${etichettaMotivo(sub.motivo)}</span>
         <button class="btn small ghost" onclick="annullaSost('${slot.k}')">Annulla sostituzione</button>`
      : `<button class="btn small ghost" onclick="apriSost('${slot.k}')">Sostituisci esercizio</button>`;
    return `<div class="exercise">
      <div class="exhead">
        <div class="exname">${e.l}</div>
        <div class="exmove">
          <button class="btn small" onclick="moveExercise(-1,'${slot.k}')" title="Sposta su">&#8593;</button>
          <button class="btn small" onclick="moveExercise(1,'${slot.k}')" title="Sposta gi\u00f9">&#8595;</button>
        </div>
      </div>
      <div class="target">Target: ${e.sets} serie \u00d7 ${repLabel} ripetizioni${rirLabel} \u00b7 Recupero ${recLabel(recSec)}${e.bw ? " \u00b7 corpo libero" : ""}</div>
      ${romHtml}
      ${notaFissaHtml}
      <div class="prev">${prevText}</div>
      ${prevNotaHtml}
      ${suggHtml}
      <div class="setrows">${nWarm ? warmRows+'<div class="warmsep">serie allenanti</div>' : ""}${setRows}</div>
      <div class="alt">${piede}</div>
      ${pannello}
    </div>`;
  }).join("")
    + bloccoFuoriSlot(wl, ordinati);
}
function setSetField(exKey, field, setIdx, val){
  const wl = ensureWL();
  if(!wl[field]) wl[field]={};
  if(!Array.isArray(wl[field][exKey])) wl[field][exKey]=[];
  wl[field][exKey][setIdx] = val==="" ? "" : Number(val);
  autoMarkDoneIfData(wl);
  saveDB();
  // Il recupero parte quando chiudi una serie allenante registrando le ripetizioni.
  // Solo per la giornata di oggi: se stai sistemando un log vecchio non ha senso.
  if(field === "repsLog" && val !== "" && selDate === todayStr()){
    const g = wl.giorno || computeNextGiorno();
    let ex = (DB.exdb[g] && DB.exdb[g].ex || []).find(x=>x.k===exKey);
    if(!ex) ex = exByKey(exKey);   // esercizio entrato oggi per sostituzione
    // Nessun recupero dopo l'ultima serie allenante: da li' passi all'esercizio
    // successivo, e lo spostamento fa gia' da pausa.
    if(ex && (setIdx + 1) >= ex.sets){
      stopRest();
    } else {
      startRest(recForEx(exKey, g), (ex ? ex.l : "") + " · serie " + (setIdx+1) + " fatta");
    }
  }
  // v23 - niente render() completo: si aggiornano solo stato seduta e colore del RIR,
  // cosi' il focus resta sul campo e la tastiera non si chiude.
  if(field === "rirLog"){
    const inp = document.getElementById(`sf_rirLog_${exKey}_${setIdx}`);
    if(inp){
      let ex2 = exByKey(exKey);
      const tgt = ex2 && Array.isArray(ex2.rir) ? ex2.rir[setIdx] : undefined;
      inp.className = classeRir(wl.rirLog[exKey][setIdx], tgt);
    }
  }
  aggiornaStatoSeduta();
}
function setAlt(exKey, checked){
  const wl = ensureWL();
  if(!wl.useAlt) wl.useAlt={};
  wl.useAlt[exKey]=checked;
  saveDB(); render();
}
function setAltNote(exKey, val){
  const wl = ensureWL();
  if(!wl.useAltNote) wl.useAltNote={};
  wl.useAltNote[exKey]=val;
  saveDB();
}
function markDone(){
  const wl = ensureWL();
  wl.done = true; wl.skipped = false;
  saveDB(); toast("Allenamento segnato come fatto"); render();
}
function markSkipped(){
  const wl = ensureWL();
  wl.done = false; wl.skipped = true;
  saveDB(); toast("Allenamento segnato come saltato — resta in coda"); render();
}
function markUndone(){
  const wl = ensureWL();
  wl.done = false; wl.skipped = false;
  saveDB(); toast("Completamento annullato"); render();
}

function allExerciseDefs(){
  const out = [];
  Object.values(DB.exdb).forEach(day=>{

// v23 - Esercizi che non sono piu' in scheda ma hanno serie registrate (i 5 tolti
// il 4 settembre, o quelli eliminati dall'editor): lo storico c'e', va solo mostrato.
function exerciseDefsFuoriScheda(){
  const inScheda = {};
  allExerciseDefs().forEach(e=>{ inScheda[e.k] = true; });
  const trovati = {};
  Object.keys(DB.workoutLog||{}).forEach(d=>{
    const w = DB.workoutLog[d];
    Object.keys((w && w.pesi) || {}).forEach(k=>{
      if(inScheda[k] || trovati[k]) return;
      if(Array.isArray(w.pesi[k]) && w.pesi[k].some(v=>v!=="" && v!==null && v!==undefined)) trovati[k] = true;
    });
  });
  return Object.keys(trovati).sort().map(k=>({k, l: etichettaChiave(k)}));
}
function etichettaChiave(k){
  return String(k).split("-").filter(Boolean).map((p,i)=> i===0 ? p.charAt(0).toUpperCase()+p.slice(1) : p).join(" ");
}
function renderExerciseHistoryHtml(exKey){
  const conPesi = d => {
    const w = DB.workoutLog[d];

  // v21 - anche le sedute con la sola nota entrano nella tabella (non nel grafico)
  const conNota = d => notaSedutaPiena(DB.workoutLog[d] && DB.workoutLog[d].exNota && DB.workoutLog[d].exNota[exKey]);
  const dates = Object.keys(DB.workoutLog).filter(conPesi).sort();
  const datesTab = Object.keys(DB.workoutLog).filter(d => conPesi(d) || conNota(d)).sort();
  if(datesTab.length===0) return `<div class="empty">Nessun dato registrato per questo esercizio</div>`;
  const topSetSeries = dates.map(d=>{
    const nums = (DB.workoutLog[d].pesi[exKey]||[]).filter(v=>v!=="" && v!==null && v!==undefined && !isNaN(v)).map(Number);
    return {x:d, y: nums.length ? Math.max(...nums) : 0};
  });
  const rows = datesTab.slice().reverse().map(d=>{
    const kg = (DB.workoutLog[d].pesi && DB.workoutLog[d].pesi[exKey]) || [];
    const reps = (DB.workoutLog[d].repsLog && DB.workoutLog[d].repsLog[exKey]) || [];
    const rirs = (DB.workoutLog[d].rirLog && DB.workoutLog[d].rirLog[exKey]) || [];
    const setsTxt = kg.map((v,i)=>{
      const kgTxt = (v==="" || v===null || v===undefined) ? "–" : v;
      const r = reps[i];
      const repTxt = (r!==undefined && r!==null && r!=="") ? `×${r}` : "";
      const rr = rirs[i];
      const rirTxt = (rr!==undefined && rr!==null && rr!=="") ? ` @${rr}` : "";
      return `${kgTxt}kg${repTxt}${rirTxt}`;
    }).join(", ");
    const nt = DB.workoutLog[d].exNota && DB.workoutLog[d].exNota[exKey];
    const ntHtml = notaSedutaPiena(nt) ? `<div class="histnota">${testoNotaSeduta(notaSeduta(DB.workoutLog[d], exKey))}</div>` : "";
    return `<tr><td>${niceDate(d)}</td><td>${setsTxt || "\u2014"}${ntHtml}</td></tr>`;
  }).join("");
  return `
    ${topSetSeries.length ? lineChart(topSetSeries, "#16A34A") : ""}
    <table class="progtable">
      <thead><tr><th>Data</th><th>Serie (kg×rip)</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}
function weeklyAdherence(){
  const start = DB.programStart;
  const out = [];
  let weekStart = start;
  const now = todayStr();
  let guard=0;
  const target = DB.weeklyTarget || 5;
  while(weekStart <= now && guard<26){
    guard++;
    const days = [...Array(7)].map((_,i)=>addDays(weekStart,i));
    let done=0;
    days.forEach(d=>{
      if(d>now) return;
      if(DB.workoutLog[d] && DB.workoutLog[d].done) done++;
    });
    out.push({label:`S${out.length+1}`, done, planned: target});
    weekStart = addDays(weekStart,7);
  }
  return out.slice(-8);
}
function lineChart(series, color, targetLine){
  if(series.length<1) return `<div class="empty">Dati insufficienti</div>`;
  const W=320,H=110,PAD=8;
  const ys = series.map(p=>p.y);
  let min = Math.min(...ys, targetLine||Infinity);
  let max = Math.max(...ys, targetLine||-Infinity);
  if(min===max){ min-=1; max+=1; }
  const stepX = series.length>1 ? (W-2*PAD)/(series.length-1) : 0;
  const pts = series.map((p,i)=>{
    const x = PAD + i*stepX;
    const y = H-PAD - ((p.y-min)/(max-min))*(H-2*PAD);
    return `${x},${y}`;
  });
  let extra = "";
  if(targetLine){
    const ty = H-PAD - ((targetLine-min)/(max-min))*(H-2*PAD);
    extra = `<line x1="${PAD}" y1="${ty}" x2="${W-PAD}" y2="${ty}" stroke="#8B93A7" stroke-width="1" stroke-dasharray="4,3"/>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
    ${extra}
    <polyline points="${pts.join(" ")}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>`<circle cx="${p.split(",")[0]}" cy="${p.split(",")[1]}" r="2" fill="${color}"/>`).join("")}
  </svg>
  <div class="row between" style="font-size:11px;color:var(--muted);margin-top:2px;">
    <span>${series[0].x.slice(5)}</span><span>${series[series.length-1].x.slice(5)}</span>
  </div>`;
}
function barChart(weeks){
  if(!weeks.length) return `<div class="empty">Dati insufficienti</div>`;
  const W=320, H=120, PAD=6, gap=6;
  const bw = (W-2*PAD-gap*(weeks.length-1))/weeks.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H+18}">
    ${weeks.map((w,i)=>{
      const pct = w.planned>0 ? w.done/w.planned : 0;
      const barH = pct*(H-20);
      const x = PAD+i*(bw+gap);
      const color = pct>=0.8?"#16A34A":pct>=0.5?"#D97706":"#DC2626";
      return `<rect x="${x}" y="${H-barH}" width="${bw}" height="${barH}" rx="3" fill="${color}"/>
        <text x="${x+bw/2}" y="${H+14}" font-size="9" fill="#8B93A7" text-anchor="middle">${w.label}</text>
        <text x="${x+bw/2}" y="${H-barH-4}" font-size="9" fill="#F3F4F6" text-anchor="middle">${w.done}/${w.planned}</text>`;
    }).join("")}
  </svg>`;
}
function addPeso(){
  const d = document.getElementById("pesoDate").value;
  const v = Number(document.getElementById("pesoVal").value);
  const bfEl = document.getElementById("pesoBf");
  const bf = bfEl && bfEl.value!=="" ? Number(bfEl.value) : null;
  if(!d || !v){ toast("Inserisci data e peso"); return; }
  if(bf!==null && (isNaN(bf) || bf<3 || bf>60)){ toast("Percentuale di grasso non valida"); return; }
  DB.pesoLog = DB.pesoLog.filter(p=>p.date!==d);
  const rec = {date:d, kg:v};
  if(bf!==null) rec.bf = bf;
  DB.pesoLog.push(rec);
  saveDB(); toast(bf!==null ? "Peso e composizione registrati" : "Peso registrato"); render();
}
// Massa magra e massa grassa: il numero assoluto della bilancia impedenziometrica
// vale poco, il trend nelle stesse condizioni vale molto.
function renderComposizione(peso){
  const conBf = peso.filter(p=>typeof p.bf === "number");
  if(!conBf.length) return "";
  const ultimo = conBf[conBf.length-1];
  const primo = conBf[0];
  const fm = k => round1(k.kg * k.bf / 100);
  const lm = k => round1(k.kg - k.kg * k.bf / 100);
  const dFm = conBf.length>1 ? round1(fm(ultimo)-fm(primo)) : null;
  const dLm = conBf.length>1 ? round1(lm(ultimo)-lm(primo)) : null;
  const seg = (v,buonoSeNegativo) => v===null ? "var(--muted)"
    : (buonoSeNegativo ? (v<=0?"var(--green-light)":"var(--red-light)")
                       : (v>=0?"var(--green-light)":"var(--red-light)"));
  const sgn = v => (v>0?"+":"")+v;
  return `
    <div class="card">
      <h2>Composizione corporea</h2>
      <div class="grid3">
        <div class="stat"><div class="n">${lm(ultimo)}kg</div><div class="l">massa magra</div></div>
        <div class="stat"><div class="n">${fm(ultimo)}kg</div><div class="l">massa grassa</div></div>
        <div class="stat"><div class="n">${ultimo.bf}%</div><div class="l">grasso corporeo</div></div>
      </div>
      ${conBf.length>1 ? `<div class="row between" style="margin-top:10px;font-size:12px;color:var(--muted);">
        <div>Grassa: <b style="color:${seg(dFm,true)};">${sgn(dFm)}kg</b></div>
        <div>Magra: <b style="color:${seg(dLm,false)};">${sgn(dLm)}kg</b></div>
        <div>dal ${niceDate(primo.date)}</div>
      </div>` : `<div class="muted" style="font-size:11.5px;margin-top:8px;">
        Prima misurazione registrata. Il dato utile è il confronto: serve almeno una seconda rilevazione.
      </div>`}
      ${conBf.length>1 ? lineChart(conBf.map(p=>({x:p.date,y:p.bf})), "#D4A24C", null) : ""}
    </div>`;
}
function renderPhotoGrid(){
  if(!DB.fotoLog.length) return `<div class="empty">Nessuna foto ancora</div>`;
  const sorted = [...DB.fotoLog].sort((a,b)=>b.date.localeCompare(a.date));
  // Le immagini in IndexedDB arrivano dopo (caricaFotoGrid): qui si mette il posto.
  return `<div class="photogrid" id="photoGrid">${sorted.map(f=>{
    const src = f.dataUrl ? f.dataUrl : "";
    if(!src && !f.idb) return `<div class="stat" style="aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;font-size:10px;">${f.date}<br>(no img)</div>`;
    return `<div class="photocell">
      <img ${src ? `src="${src}"` : `data-fid="${escH(f.id)}"`} alt="Foto del ${niceDate(f.date)}" onclick="mostraFoto(this)">
      <span class="pdate">${f.date.slice(5)}</span>
      <button class="pdel" onclick="eliminaFoto('${escH(f.id)}')" title="Elimina foto">×</button>
    </div>`;
  }).join("")}</div>`;
}
function caricaFotoGrid(){
  const imgs = document.querySelectorAll("#photoGrid img[data-fid]");
  if(!imgs.length) return;
  fotoAll().then(all=>{
    imgs.forEach(im=>{ const d = all[im.dataset.fid]; if(d) im.src = d; });
  }).catch(()=>{});
}
function mostraFoto(img){
  if(!img.src) return;
  const ov = document.createElement("div");
  ov.id = "fotoOverlay";
  ov.style = "position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;";
  ov.innerHTML = `<img src="${img.src}" alt="" style="flex:1;min-height:0;width:100%;object-fit:contain;">
    <div style="padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;color:#8B93A7;font-size:13px;">
      <span>${escH(img.alt)}</span><button class="btn small" onclick="document.getElementById('fotoOverlay').remove()">Chiudi</button></div>`;
  document.body.appendChild(ov);
}
function eliminaFoto(id){
  const f = DB.fotoLog.find(x=>x.id===id);
  if(!f) return;
  if(!confirm("Eliminare la foto del " + niceDate(f.date) + "? Non si puo' annullare.")) return;
  DB.fotoLog = DB.fotoLog.filter(x=>x.id!==id);
  saveDB();
  if(f.idb) fotoDel(id).catch(()=>{});
  toast("Foto eliminata"); render();
}
function addPhoto(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const maxW = 900;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement("canvas");
      canvas.width = img.width*scale; canvas.height = img.height*scale;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.72);
      const rec = {id:uid(), date: todayStr(), note:""};
      fotoPut(rec.id, dataUrl).then(()=>{
        rec.idb = true;
        DB.fotoLog.push(rec); saveDB(); toast("Foto salvata"); render();
      }).catch(()=>{
        // niente IndexedDB: vecchio modo, dentro localStorage
        rec.dataUrl = dataUrl;
        DB.fotoLog.push(rec); saveDB();
        toast(STORAGE_KO ? "Spazio esaurito: foto NON salvata" : "Foto salvata"); render();
      });
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  input.value = "";
}

// v23 - quanto spazio usano i dati, e se Android puo' cancellarli da solo.
async function aggiornaStorageInfo(){
  const el = document.getElementById("storageInfo");
  if(!el) return;
  const chars = (localStorage.getItem(STORE_KEY)||"").length;
  const MAX = 5000000; // tetto pratico di localStorage su Chrome, in caratteri
  const pct = Math.round(chars/MAX*100);
  const nFoto = (DB.fotoLog||[]).length;
  let righe = [`Dati dell'app: <b>${(chars/1000).toFixed(0)} k</b> caratteri su circa ${MAX/1000000} milioni (${pct}%)${pct>=80 ? ' <span class="pill bad">quasi pieno</span>' : ''}`];
  righe.push(`Foto progressi: <b>${nFoto}</b>` + (nFoto ? " (in IndexedDB, fuori dal limite qui sopra)" : ""));
  try{
    if(navigator.storage && navigator.storage.estimate){
      const est = await navigator.storage.estimate();
      if(est && est.usage!==undefined && est.quota){
        righe.push(`Spazio totale usato dal sito: <b>${(est.usage/1048576).toFixed(1)} MB</b> su ${(est.quota/1048576/1024).toFixed(1)} GB disponibili`);
      }
    }
    if(navigator.storage && navigator.storage.persisted){
      const p = await navigator.storage.persisted();
      righe.push(p ? `Archiviazione protetta: <span class="pill ok">sì</span> — il telefono non cancella questi dati per liberare spazio`
                   : `Archiviazione protetta: <span class="pill warn">no</span> — se il telefono resta senza spazio potrebbe svuotarla. Fai backup.`);
    }
  }catch(e){}
  el.innerHTML = righe.join("<br>");
}

function slugify(s){
  return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || "esercizio";
}
function renderSchedaEditor(){
  const strip = document.getElementById("editorDaysel");
  const body = document.getElementById("editorBody");
  if(!strip || !body) return;
  strip.innerHTML = giorniScheda().map(g=>
    `<button class="${g===editorGiorno?'active':''}" onclick="editorGiorno=${g};renderSchedaEditor();">G${g}</button>`
  ).join("");
  const day = DB.exdb[editorGiorno];
  body.innerHTML = `
    <div class="field"><label class="f">Titolo giorno</label>
      <input type="text" value="${day.label}" onchange="updateGiornoLabel(${editorGiorno}, this.value)"></div>
    ${day.ex.map((e,idx)=>`
      <div class="exercise" style="margin-bottom:8px;">
        <div class="field"><label class="f">Nome esercizio</label>
          <input type="text" value="${e.l}" onchange="updateExerciseField(${editorGiorno},${idx},'l',this.value)"></div>
        <div class="grid3">
          <div class="field"><label class="f">Serie</label>

            <input type="number" value="${e.repMin}" onchange="updateExerciseField(${editorGiorno},${idx},'repMin',this.value)"></div>

            <input type="number" value="${e.repMax}" onchange="updateExerciseField(${editorGiorno},${idx},'repMax',this.value)"></div>

        <button class="btn small" style="border-color:var(--red);color:#F87171;" onclick="removeExercise(${editorGiorno},${idx})">Elimina esercizio</button>
      </div>
    `).join("")}
    <button class="btn block" onclick="addExercise(${editorGiorno})">+ Aggiungi esercizio</button>

function updateGiornoLabel(giorno, val){
  DB.exdb[giorno].label = val;
  saveDB();
}
function addExercise(giorno){
  const key = slugify("nuovo-esercizio") + "-" + uid().slice(0,4);
  DB.exdb[giorno].ex.push({k:key, l:"Nuovo esercizio", sets:3, repMin:10, repMax:12});
  saveDB(); renderSchedaEditor(); toast("Esercizio aggiunto");
}
function updateExerciseField(giorno, idx, field, val){
  const ex = DB.exdb[giorno].ex[idx];
  if(!ex) return;
  if(field==="l") ex.l = val;
  else if(field==="sets") ex.sets = Math.max(1, Number(val)||1);
  else if(field==="repMin") ex.repMin = Math.max(1, Number(val)||1);
  else if(field==="repMax") ex.repMax = Math.max(ex.repMin||1, Number(val)||1);
  saveDB();
}
function removeExercise(giorno, idx){
  DB.exdb[giorno].ex.splice(idx,1);
  saveDB(); renderSchedaEditor(); toast("Esercizio eliminato");
}
function resetSchedaDefault(){
  if(!confirm("Ripristinare la scheda di default? Le modifiche fatte qui andranno perse (lo storico di pesi/ripetizioni registrato resta intatto).")) return;
  DB.exdb = JSON.parse(JSON.stringify(DEFAULT_EXDB));
  saveDB(); toast("Scheda ripristinata"); render();
}

function updatePianoFissoField(slot, idx, field, val){
  const it = DB.pianoFisso[slot][idx];
  if(!it) return;
  if(field==="l" || field==="unit") it[field] = val;
  else it[field] = Number(val)||0;
  it.customized = true;
  saveDB();
}
function addPianoFissoItem(slot){
  DB.pianoFisso[slot].push({id:"custom-"+uid(), l:"Nuovo alimento", unit:"porzione", kcalU:0, proU:0, carbU:0, fatU:0, defaultQty:1, customized:true});
  saveDB(); renderPianoFissoEditor(); toast("Alimento aggiunto");
}
function removePianoFissoItem(slot, idx){
  const it = DB.pianoFisso[slot][idx];
  if(!it) return;
  if(!confirm(`Togliere "${it.l}" dal piano?\n\nLo storico dei giorni gi\u00e0 registrati resta intatto: l'alimento finisce in Archivio, in fondo a questa pagina.`)) return;
  if(!DB.pianoFissoArchivio) DB.pianoFissoArchivio = [];
  if(!DB.pianoFissoArchivio.some(a=>a.id===it.id && a.slot===slot)){
    DB.pianoFissoArchivio.push(Object.assign({}, it, {slot, archiviato:true}));
  }
  DB.pianoFisso[slot].splice(idx,1);
  saveDB(); renderPianoFissoEditor(); toast("Alimento archiviato");
}
function updateArchivioField(id, slot, field, val){
  const it = (DB.pianoFissoArchivio||[]).find(a=>a.id===id && a.slot===slot);
  if(!it) return;
  if(field==="l" || field==="unit") it[field] = val;
  else it[field] = Number(val)||0;
  saveDB();
  if(field!=="l") renderPianoFissoEditor();
}
function ripristinaArchivio(id, slot){
  const i = (DB.pianoFissoArchivio||[]).findIndex(a=>a.id===id && a.slot===slot);
  if(i<0) return;
  const it = DB.pianoFissoArchivio.splice(i,1)[0];
  delete it.archiviato; delete it.slot;
  if(!DB.pianoFisso[slot]) DB.pianoFisso[slot] = [];
  DB.pianoFisso[slot].push(it);
  saveDB(); renderPianoFissoEditor(); toast("Rimesso nel piano");
}
function resetPianoFissoDefault(){
  if(!confirm("Ripristinare il piano fisso di default? Le modifiche fatte qui andranno perse (lo storico dei pasti registrati resta intatto).")) return;
  DB.pianoFisso = JSON.parse(JSON.stringify(DEFAULT_PIANO_FISSO));
  saveDB(); toast("Piano fisso ripristinato"); render();
}
async function exportData(){
  // v23 - le foto stanno in IndexedDB: nel file di backup viaggiano in fotoData {id: dataUrl}
  let fotoData = {};
  try{ fotoData = await fotoAll(); }catch(e){ fotoData = {}; }
  const out = Object.assign({}, DB, {fotoData});
  const blob = new Blob([JSON.stringify(out, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `totta-fitness-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 10000);
  toast("Backup pronto: " + Object.keys(fotoData).length + " foto incluse");
}
function importData(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const old = JSON.parse(ev.target.result);

      // Backup nativo dell'app (creato con "Esporta dati" da questa stessa app):
      // ripristino completo e diretto, nessuna perdita di foto/ripetizioni/scheda personalizzata.
      if(old.version===1 && old.exdb){
        const fotoData = old.fotoData || {};
        delete old.fotoData;
        DB = Object.assign(defaultDB(), old);
        saveDB();
        // v23 - foto del backup in IndexedDB, poi eventuali foto vecchie ancora inline
        const ids = Object.keys(fotoData);
        Promise.all(ids.map(id=>fotoPut(id, fotoData[id]))).catch(()=>{})
          .then(()=>migraFotoInIdb())
          .then(()=>{ toast("Backup ripristinato" + (ids.length ? " con " + ids.length + " foto" : "")); render(); });
        return;
      }

      alert("Questo file non e\u0300 un backup di Totta Fitness.");
    }catch(e){
      alert("File non valido: "+e.message);
    }
  };
  reader.readAsText(file);
}
function wipeData(){
  if(!confirm("Cancellare TUTTI i dati salvati su questo telefono? Non si può annullare.")) return;
  localStorage.removeItem(STORE_KEY);
  fotoClear().catch(()=>{});
  DB = defaultDB();
  toast("Dati cancellati");
  render();
}

/* ============================= INIT ============================= */
render();

/* v23 - Cambio giorno con l'app rimasta aperta.
   Un'app installata resta viva in background per giorni: prima selDate restava
   fermo al giorno dell'apertura e la colazione finiva registrata su ieri.
   Ogni volta che l'app torna visibile, se la data e' cambiata si riparte da oggi. */
let GIORNO_MOSTRATO = todayStr();
function controllaCambioGiorno(){
  const oggi = todayStr();
  if(oggi === GIORNO_MOSTRATO) return;
  GIORNO_MOSTRATO = oggi;
  selDate = oggi;
  SOST = {slot:null, motivo:null};
  render();
  toast("Nuovo giorno: " + niceDate(oggi));
}
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) controllaCambioGiorno(); });
window.addEventListener("focus", controllaCambioGiorno);
window.addEventListener("pageshow", controllaCambioGiorno);
setInterval(controllaCambioGiorno, 60000);

/* v23 - Archiviazione protetta: senza questa richiesta Android puo' svuotare i dati
   del sito quando lo spazio scarseggia. Esito visibile in Impostazioni > Backup e dati. */
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}

// v23 - foto gia' salvate in localStorage: spostate in IndexedDB una volta sola
migraFotoInIdb().then(ok=>{ if(ok && currentTab==="progressi") render(); }).catch(()=>{});

/* v23 - Aggiornamenti: il service worker nuovo si installa alla prima apertura ma la
   pagina in uso e' ancora quella vecchia. Invece di chiedere di "aprire due volte",
   quando il nuovo worker e' pronto compare il banner "Aggiorna ora". */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("service-worker.js").then(reg=>{
      const segnala = (w)=>{
        if(!w) return;
        w.addEventListener("statechange", ()=>{
          if(w.state === "installed" && navigator.serviceWorker.controller){
            const el = document.getElementById("updateAlert");
            if(el) el.classList.add("show");
          }
        });
      };
      if(reg.waiting && navigator.serviceWorker.controller){
        const el = document.getElementById("updateAlert"); if(el) el.classList.add("show");
      }
      segnala(reg.installing);
      reg.addEventListener("updatefound", ()=>segnala(reg.installing));
      // controlla se c'e' una versione nuova ogni volta che l'app torna in primo piano
      document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) reg.update().catch(()=>{}); });
    }).catch(()=>{});
  });
}
</script>
